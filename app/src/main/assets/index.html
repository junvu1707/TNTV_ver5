  <!-- ========================================== -->
  <!-- [BLOCK 1: CSS & UI STYLES] -->
  <!-- ========================================== -->
  <style>
    /* Hoạ tiết vân mây trống đồng và giấy điệp dân gian */
    html {
      background-color: #FEF3C7;
    }
    body {
      background-color: #FEF3C7;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.15) 0%, transparent 75%),
        radial-gradient(circle at 100% 100%, rgba(220, 38, 38, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(5, 150, 105, 0.08) 0%, transparent 50%);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Hiệu ứng nổi 3D cho các nút bấm thiếu nhi */
    .btn-3d {
      transition: all 0.1s ease-in-out;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    }
    .btn-3d:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }
    .btn-3d-gold {
      background: linear-gradient(180deg, #FBBF24 0%, #D97706 100%);
      box-shadow: 0 4px 0 #92400E;
    }
    .btn-3d-gold:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #92400E;
    }
    .btn-3d-red {
      background: linear-gradient(180deg, #EF4444 0%, #B91C1C 100%);
      box-shadow: 0 4px 0 #7F1D1D;
    }
    .btn-3d-red:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7F1D1D;
    }
    .btn-3d-green {
      background: linear-gradient(180deg, #34D399 0%, #059669 100%);
      box-shadow: 0 4px 0 #064E3B;
    }
    .btn-3d-green:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #064E3B;
    }
    .btn-3d-blue {
      background: linear-gradient(180deg, #60A5FA 0%, #2563EB 100%);
      box-shadow: 0 4px 0 #1E40AF;
    }
    .btn-3d-blue:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1E40AF;
    }

    /* Thẻ bài phong cách khoa cử truyền thống */
    .scroll-card {
      background: #FFFFFF;
      border: 3px solid #FCD34D;
      box-shadow: 0 8px 16px -2px rgba(217, 119, 6, 0.15);
      border-radius: 1.25rem;
    }

    /* Nút giỏ phân loại Bé thông minh */
    .basket-zone {
      min-height: 100px;
      transition: all 0.2s ease;
      background: linear-gradient(180deg, #FFFBEB 0%, #FEF3C7 100%);
    }
    .basket-zone.highlight {
      border-color: #059669;
      background: #D1FAE5;
      transform: scale(1.02);
    }

    /* Thẻ ghép đôi Bé tinh mắt */
    .match-tile {
      min-height: 52px;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }
    .match-tile.selected {
      background-color: #FEF08A !important;
      border-color: #CA8A04 !important;
      transform: scale(1.04);
      box-shadow: 0 0 12px rgba(202, 138, 4, 0.4);
    }
    .match-tile.matched {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .match-tile.wrong-shake {
      animation: shake 0.4s ease-in-out;
      background-color: #FEE2E2 !important;
      border-color: #DC2626 !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Nút điều hướng 30 câu hỏi của Đề thi Tổng hợp */
    .q-nav-pill {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1.5px solid #CBD5E1;
      background: #F8FAFC;
      color: #475569;
    }
    .q-nav-pill.active {
      background: #F59E0B !important;
      color: #78350F !important;
      border-color: #B45309 !important;
      transform: scale(1.12);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      z-index: 10;
    }
    .q-nav-pill.answered {
      background: #10B981;
      color: #FFFFFF;
      border-color: #047857;
    }

    /* Trống đồng SVG làm họa tiết trang trí */
    .dong-son-pattern {
      background-image: radial-gradient(#F59E0B 1px, transparent 1px), radial-gradient(#DC2626 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      opacity: 0.12;
    }
  </style>
</head>

  // PRNG (Hàm băm ngẫu nhiên có hạt giống deterministic)
  function seededRandom(seed) {
    const x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  // Thuật toán sinh hoán vị ngẫu nhiên có hạt giống
  function seededShuffle(arr, seed) {
    const res = [...arr];
    let s = seed;
    for (let i = res.length - 1; i > 0; i--) {
      s++;
      const j = Math.floor(seededRandom(s) * (i + 1));
      [res[i], res[j]] = [res[j], res[i]];
    }
    return res;
  }

          answer: "Buổi sớm mai",
          wrong: ["Buổi trưa hè", "Buổi hoàng hôn", "Đêm trăng thanh"],
          missing: "sớm mai"
        },
        {
          passage: "Hè qua thu về\nChú ve đã ngủ\nChị gió la đà\nBờ tre, lá cọ.",
          question: "Khi hè qua thu về, chú ve làm gì?",
          answer: "Chú ve đã ngủ",
          wrong: ["Chú ve ca hát", "Chú ve đi học", "Chú ve bay đi"],
          missing: "ngủ"
        },
        {
          passage: "Sáng sớm thức giấc\nBé chào ngày mới\nChào ông mặt trời\nTỏa nắng muôn nơi.",
          question: "Bé thức dậy và chào ai vào sáng sớm?",
          answer: "Chào ông mặt trời",
          wrong: ["Chào chị mây", "Chào con mèo", "Chào dòng sông"],
          missing: "mặt trời"
        },
        {
          passage: "Con cò bay lả bay la\nBay từ cửa phủ bay ra đồng ruộng\nCánh trắng như bông\nChao nghiêng trong nắng.",
          question: "Cánh của con cò được so sánh với cái gì?",
          answer: "Trắng như bông",
          wrong: ["Xanh như lá", "Đỏ như lửa", "Đen như khói"],
          missing: "bông"
        },
        {
          passage: "Chú gà trống nhỏ\nMào đỏ như hoa\nGáy ó o o\nĐánh thức mọi nhà.",
          question: "Chi tiết nào miêu tả mào của chú gà trống?",
          answer: "Mào đỏ như hoa",
          wrong: ["Mào xanh như lá", "Mào trắng như tuyết", "Mào vàng như nắng"],
          missing: "hoa"
        },
        {
          passage: "Mùa xuân đã đến\nHoa đào nở hồng\nChim hót ríu rít\nNắng ấm khắp đồng.",
          question: "Mùa xuân đến, hoa gì nở hồng?",
          answer: "Hoa đào",
          wrong: ["Hoa sen", "Hoa cúc", "Hoa lan"],
          missing: "đào"
        }
      ];

      const punsCap4 = [
        { qText: "Bỏ chữ 'b' thêm chữ 'c' thì thành người bạn dẫn nước qua sông? (Bầu -> ...)", ans: "Cầu", opts: ["Cầu", "Cần", "Cậu", "Cây"] },
        { qText: "Để nguyên lợp mái nhà (tranh)\nThay 'c' vào thành quả chua ngon (...)?", ans: "Chanh", opts: ["Chanh", "Chuối", "Chôm chôm", "Chanh dây"] },
        { qText: "Để nguyên làm bằng cây gỗ (bàn)\nThay sắc vào thành nơi bạn bè chơi (bán)...?", ans: "Bán", opts: ["Bán", "Bút", "Bảng", "Bóng"] },
        { qText: "Để nguyên giúp bé tập bơi (phao)\nBớt 'ph' thêm 's' thành từ chỉ hoa màu ngạt...?", ans: "Phao", opts: ["Phao", "Phấn", "Phím", "Phố"] },
        { qText: "Từ nào bỏ chữ đầu thành tên loài quả ngọt đỏ thắm chín trên cây?", ans: "Quả cam", opts: ["Quả cam", "Quả na", "Quả lê", "Quả bí"] },
        { qText: "Để nguyên sáng rọi đêm rằm (trăng)\nThêm sắc thành màu sắc tinh khôi (trắng)...?", ans: "Trăng", opts: ["Trăng", "Trắng", "Tròn", "Trong"] }
      ];

      // =============================================================
      // SINH ĐỦ 30 CÂU HỎI ĐỘC LẬP CHO BỘ ĐỀ LỚP 1
      // =============================================================
      for (let qIdx = 0; qIdx < 30; qIdx++) {
        const globalSeq = baseGlobalSeq + qIdx;

        if (qIdx < 15) {
          // --- PHẦN 1: 15 TRẮC NGHIỆM (MCQ / READING) ---
          if (cap === 1) {
            let qText = "", opts = [], cIdx = 0, exText = "";
            const mode = qIdx % 8;
            if (mode === 0 || mode === 1) {
              const isK = (globalSeq % 2) === 0;
              const w = isK ? kWords[globalSeq % kWords.length] : cWords[globalSeq % cWords.length];
              if (isK) {
                qText = `Âm 'k' viết đúng quy tắc chính tả khi đứng trước các nguyên âm nào (ví dụ trong từ '${w}')?`;
                opts = ["i, e, ê", "a, o, ô", "u, ư, ơ", "o, ô, ơ"];
                cIdx = 0;
                exText = "Quy tắc chính tả Lớp 1: Âm 'k' chỉ ghép với i, e, ê.";
              } else {
                qText = `Âm 'c' viết đúng quy tắc chính tả khi đứng trước các nguyên âm nào (ví dụ trong từ '${w}')?`;
                opts = ["a, o, ô, ơ, u, ư", "i, e, ê", "e, ê, i", "i, e, u"];
                cIdx = 0;
                exText = "Quy tắc chính tả Lớp 1: Âm 'c' đi với a, o, ô, ơ, u, ư.";
              }
            } else if (mode === 2 || mode === 3) {
              const isGh = (globalSeq % 2) === 0;
              const item = isGh ? ghWords[globalSeq % ghWords.length] : gWords[globalSeq % gWords.length];
              qText = `Từ '${item.word}' sử dụng âm đầu nào đúng quy tắc chính tả Tiếng Việt?`;
              opts = [isGh ? "gh" : "g", isGh ? "g" : "gh", "c", "k"];
              cIdx = 0;
              exText = item.rule;
            } else if (mode === 4) {
              const isNgh = (globalSeq % 2) === 0;
              const item = isNgh ? nghWords[globalSeq % nghWords.length] : ngWords[globalSeq % ngWords.length];
              qText = `Từ '${item.word}' sử dụng âm đầu nào đúng chính tả Lớp 1?`;
              opts = [isNgh ? "ngh" : "ng", isNgh ? "ng" : "ngh", "g", "gh"];
              cIdx = 0;
              exText = item.rule;
            } else if (mode === 5) {
              const item = rhymesPool[globalSeq % rhymesPool.length];
              qText = `Tiếng nào chứa vần '${item.r}' trong từ '${item.w}'?`;
              opts = item.opts;
              cIdx = 0;
              exText = `Từ '${item.w}' chứa vần '${item.r}'.`;
            } else if (mode === 6) {
              const item = tonesPool[globalSeq % tonesPool.length];
              qText = `Tiếng '${item.char}' trong từ '${item.word}' mang dấu thanh nào?`;
              opts = [item.tone, "thanh huyền", "thanh hỏi", "thanh sắc"].filter((v, idx, arr) => arr.indexOf(v) === idx).slice(0, 4);
              cIdx = 0;
              exText = `Tiếng '${item.char}' mang ${item.tone}.`;
            } else {
              const a = animalsList[globalSeq % animalsList.length];
              qText = `Từ ngữ nào dưới đây là tên một con vật quen thuộc?`;
              opts = [a, "bút chì", "cục tẩy", "thước kẻ"];
              cIdx = 0;
              exText = `${a} là từ chỉ con vật.`;
            }

            const shuffledOpts = seededShuffle([...opts], globalSeq * 17);
            questions.push({
              id: qIdx + 1,
              type: 'MCQ',
              title: 'Lớp 1 • Cấp 1: Nhận diện Âm vần & Từ vựng',
              question: qText,
              options: shuffledOpts,
              correctIndex: shuffledOpts.indexOf(opts[cIdx]),
              explain: exText
            });

          } else if (cap === 2) {
            let qText = "", opts = [], cIdx = 0, exText = "";
            const mode = qIdx % 7;
            if (mode === 0) {
              const item = chTrPool[globalSeq % chTrPool.length];
              qText = `Từ nào viết đúng chính tả phân biệt ch/tr?`;
              opts = [item.correct, item.wrong, "chre ngà", "tranh chanh"];
              cIdx = 0;
              exText = `'${item.correct}' viết đúng chính tả.`;
            } else if (mode === 1) {
              const item = sXPool[globalSeq % sXPool.length];
              qText = `Từ nào viết đúng chính tả âm 's' hoặc 'x'?`;
              opts = [item.correct, item.wrong, "xông sông", "xuân suân"];
              cIdx = 0;
              exText = `'${item.correct}' viết đúng chính tả.`;
            } else if (mode === 2) {
              const item = rDGiPool[globalSeq % rDGiPool.length];
              qText = `Phân biệt r/d/gi: Từ nào viết đúng chính tả?`;
              opts = [item.correct, item.wrong, "gòn rùa", "rịu dối"];
              cIdx = 0;
              exText = `'${item.correct}' là từ đúng.`;
            } else if (mode === 3) {
              const item = ienYenPool[globalSeq % ienYenPool.length];
              qText = `Phân biệt vần iên/yên: Từ nào viết đúng chính tả?`;
              opts = [item.correct, item.wrong, "yên tiên", "iên yên"];
              cIdx = 0;
              exText = "yên đứng đầu tiếng không âm đầu, iên đứng sau âm đầu.";
            } else if (mode === 4) {
              const item = uomUongPool[globalSeq % uomUongPool.length];
              qText = `Phân biệt uôm/uông: Từ nào viết đúng chính tả?`;
              opts = [item.correct, item.wrong, "uôm buồng", "uông buồm"];
              cIdx = 0;
              exText = `'${item.correct}' là từ đúng.`;
            } else if (mode === 5) {
              const v = verbsList[globalSeq % verbsList.length];
              qText = `Từ nào dưới đây là từ chỉ HOẠT ĐỘNG của học sinh?`;
              opts = [v, "cái bàn", "quyển sách", "ngôi nhà"];
              cIdx = 0;
              exText = `'${v}' chỉ hoạt động.`;
            } else {
              const adj = adjsList[globalSeq % adjsList.length];
              qText = `Từ nào dưới đây là từ chỉ ĐẶC ĐIỂM của sự vật / con người?`;
              opts = [adj, "con gà", "cái ghế", "bút chì"];
              cIdx = 0;
              exText = `'${adj}' chỉ đặc điểm.`;
            }

            const shuffledOpts = seededShuffle([...opts], globalSeq * 17);
            questions.push({
              id: qIdx + 1,
              type: 'MCQ',
              title: 'Lớp 1 • Cấp 2: Chính tả & Từ loại cơ bản',
              question: qText,
              options: shuffledOpts,
              correctIndex: shuffledOpts.indexOf(opts[cIdx]),
              explain: exText
            });

          } else if (cap === 3) {
            let qText = "", opts = [], cIdx = 0, exText = "";
            const mode = qIdx % 3;
            if (mode === 0) {
              const p = proverbsCap3[globalSeq % proverbsCap3.length];
              qText = `Câu ca dao / tục ngữ: "${p.full}" nói về chủ đề gì?`;
              opts = [p.topic, "thời tiết mùa hè", "dụng cụ làm nông", "món ăn dân dã"];
              cIdx = 0;
              exText = `Thể hiện ${p.topic}.`;
            } else if (mode === 1) {
              const r = riddlesCap3[globalSeq % riddlesCap3.length];
              qText = `Giải câu đố vần thơ ngắn:\n"${r.poem}"`;
              opts = [r.ans, "Con thỏ", "Cục tẩy", "Quyển vở"];
              cIdx = 0;
              exText = `Đáp án: ${r.ans}.`;
            } else {
              const sObj = sentencesCap3[globalSeq % sentencesCap3.length];
              qText = `Chọn câu được sắp xếp đúng ngữ pháp Tiếng Việt:`;
              opts = [sObj.ok, sObj.bad, "Bé chăm học rất bài.", "Mẹ mua quà chợ đi."];
              cIdx = 0;
              exText = `'${sObj.ok}' là câu đúng.`;
            }

            const shuffledOpts = seededShuffle([...opts], globalSeq * 17);
            questions.push({
              id: qIdx + 1,
              type: 'MCQ',
              title: 'Lớp 1 • Cấp 3: Ca dao, Tục ngữ & Câu đố',
              question: qText,
              options: shuffledOpts,
              correctIndex: shuffledOpts.indexOf(opts[cIdx]),
              explain: exText
            });

          } else {
            // CAP 4
            if (qIdx < 8) {
              const pObj = passagesCap4[globalSeq % passagesCap4.length];
              const allOpts = [pObj.answer, ...pObj.wrong];
              const shuffledOpts = seededShuffle(allOpts, globalSeq * 19);
              questions.push({
                id: qIdx + 1,
                type: 'READING',
                title: 'Lớp 1 • Cấp 4: Đọc hiểu văn bản thơ',
                passage: pObj.passage,
                question: pObj.question,
                options: shuffledOpts,
                correctIndex: shuffledOpts.indexOf(pObj.answer),
                explain: `Chi tiết có trong đoạn thơ: "${pObj.answer}".`
              });
            } else {
              const pun = punsCap4[globalSeq % punsCap4.length];
              const shuffledOpts = seededShuffle([...pun.opts], globalSeq * 19);
              questions.push({
                id: qIdx + 1,
                type: 'MCQ',
                title: 'Lớp 1 • Cấp 4: Câu đố chữ & Tư duy ngôn ngữ',
                question: `Giải câu đố chữ tư duy:\n"${pun.qText}"`,
                options: shuffledOpts,
                correctIndex: shuffledOpts.indexOf(pun.ans),
                explain: `Đáp án chuẩn: ${pun.ans}.`
              });
            }
          }

        } else if (qIdx >= 15 && qIdx <= 20) {
          // --- PHẦN 2: 6 CÂU ĐIỀN TỪ / ĐỐ CHỮ (FILL) ---
          let qText = "", ansText = "", exText = "";

          if (cap === 1) {
            const fillPool = [
              { q: "Điền chữ 'c' hoặc 'k' vào chỗ trống: 'cái [...]em'", a: "k", ex: "k đi với e" },
              { q: "Điền chữ 'g' hoặc 'gh' vào chỗ trống: 'con [...]ẹ'", a: "gh", ex: "gh đi với e" },
              { q: "Điền chữ 'ng' hoặc 'ngh' vào chỗ trống: 'suy [...]ĩ'", a: "ngh", ex: "ngh đi với i" },
              { q: "Điền vần 'an' hoặc 'at' vào chỗ trống: 'bàn ch[...] (dùng quét nhà)'", a: "an", ex: "bàn chạn -> an" },
              { q: "Điền dấu thanh thích hợp vào chỗ trống: 'quả n[...] (chín thơm)'", a: "a", ex: "quả na" },
              { q: "Điền chữ 'ch' hoặc 'tr' vào chỗ trống: 'chú [...]ó trông nhà'", a: "ch", ex: "chú chó" }
            ];
            const item = fillPool[(globalSeq + qIdx) % fillPool.length];
            qText = item.q;
            ansText = item.a;
            exText = item.ex;

          } else if (cap === 2) {
            const fillPool = [
              { q: "Điền 'ch' hoặc 'tr' vào chỗ trống: 'bức [...]anh vẽ cây tre'", a: "tr", ex: "bức tranh" },
              { q: "Điền 's' hoặc 'x' vào chỗ trống: 'dòng [...]ông xanh mát'", a: "s", ex: "dòng sông" },
              { q: "Điền 'r' hoặc 'd' hoặc 'gi' vào chỗ trống: 'cơn [...]ó thổi nhẹ'", a: "gi", ex: "cơn gió" },
              { q: "Điền vần 'iên' hoặc 'yên' vào chỗ trống: 'cô t[...] hiền từ'", a: "iên", ex: "cô tiên" },
              { q: "Điền từ chỉ hoạt động vào chỗ trống: 'Bé [...] sách rất chăm chỉ.'", a: "đọc", ex: "đọc sách" },
              { q: "Điền từ chỉ đặc điểm vào chỗ trống: 'Bông hoa hồng đỏ [...] thắm.'", a: "thắm", ex: "đỏ thắm" }
            ];
            const item = fillPool[(globalSeq + qIdx) % fillPool.length];
            qText = item.q;
            ansText = item.a;
            exText = item.ex;

          } else if (cap === 3) {
            const item = proverbsCap3[(globalSeq + qIdx) % proverbsCap3.length];
            qText = `Điền từ còn thiếu vào câu ca dao: '${item.full.replace(item.missing, '[...]')}'`;
            ansText = item.missing;
            exText = `Câu chuẩn: "${item.full}".`;

          } else {
            const item = passagesCap4[(globalSeq + qIdx) % passagesCap4.length];
            qText = `Điền từ còn thiếu vào chi tiết bài thơ: '${item.passage.replace(item.missing, '[...]')}'`;
            ansText = item.missing;
            exText = `Từ cần điền là "${item.missing}".`;
          }

          questions.push({
            id: qIdx + 1,
            type: 'FILL',
            title: `Lớp 1 • Cấp ${cap}: Điền từ / Đố chữ`,
            question: qText,
            answer: ansText,
            explain: exText
          });

        } else if (qIdx >= 21 && qIdx <= 24) {
          // --- PHẦN 3: 4 CÂU NỐI CẶP (MATCH_MINI) ---
          let miniPairs = [];
          let titleStr = `Lớp 1 • Cấp ${cap}: Nối cặp tương ứng`;

          if (cap === 1) {
            miniPairs = [
              { a: "c/k", b: "kẻ vở / con cá" },
              { a: "g/gh", b: "ghế gỗ / gà trống" },
              { a: "ng/ngh", b: "lắng nghe / ngô ngọt" }
            ];
          } else if (cap === 2) {
            miniPairs = [
              { a: "chạy nhảy", b: "từ chỉ hoạt động" },
              { a: "xinh xắn", b: "từ chỉ đặc điểm" },
              { a: "quyển sách", b: "từ chỉ sự vật" }
            ];
          } else if (cap === 3) {
            miniPairs = [
              { a: "Công cha như núi Thái Sơn", b: "Nghĩa mẹ như nước trong nguồn chảy ra." },
              { a: "Ăn quả nhớ kẻ trồng cây", b: "Uống nước nhớ nguồn." },
              { a: "Lá lành đùm lá rách", b: "Thương người như thể thương thân." }
            ];
          } else {
            miniPairs = [
              { a: "Trắng như bông", b: "Hình ảnh so sánh" },
              { a: "Chị gió la đà", b: "Hình ảnh nhân hóa" },
              { a: "Hè qua thu về", b: "Sự thay đổi thời tiết" }
            ];
          }

          questions.push({
            id: qIdx + 1,
            type: 'MATCH_MINI',
            title: titleStr,
            instruction: 'Bấm chọn 1 ô ở Cột A rồi bấm ô tương ứng ở Cột B:',
            pairs: miniPairs,
            explain: 'Nối các vế tương ứng chuẩn xác theo kiến thức Lớp 1.'
          });

        } else {
          // --- PHẦN 4: 5 CÂU PHÂN LOẠI (CLASSIFY_MINI: qIdx 25..29) ---
          let groups = [];
          let titleStr = `Lớp 1 • Cấp ${cap}: Phân loại từ ngữ`;

          if (cap === 1) {
            groups = [
              { name: "Đồ dùng học tập", words: ["bút chì", "thước kẻ"] },
              { name: "Con vật quen thuộc", words: ["gà trống", "mèo con"] }
            ];
          } else if (cap === 2) {
            groups = [
              { name: "Từ chỉ hoạt động", words: ["đọc sách", "chạy nhảy"] },
              { name: "Từ chỉ đặc điểm", words: ["ngoan ngoãn", "đỏ thắm"] }
            ];
          } else if (cap === 3) {
            groups = [
              { name: "Tình cảm Gia đình", words: ["Công cha nghĩa mẹ", "Thương yêu ông bà"] },
              { name: "Mái trường & Thầy cô", words: ["Kính yêu thầy cô", "Mến yêu bạn bè"] }
            ];
          } else {
            groups = [
              { name: "Từ chỉ thời tiết", words: ["se lạnh", "nắng ấm"] },
              { name: "Từ chỉ cảnh vật", words: ["bờ tre", "dòng sông"] }
            ];
          }

          questions.push({
            id: qIdx + 1,
            type: 'CLASSIFY_MINI',
            title: titleStr,
            instruction: 'Bấm chọn từ xếp vào giỏ đúng nhóm:',
            groups: groups,
            explain: 'Phân loại các từ ngữ vào nhóm thích hợp.'
          });
        }
      }

      return {
        mode: 2,
        grade: 1,
        roundNum,
        seed,
        questions
      };
    },

    // ========================================================
    // BỘ SINH ĐỀ CHUẨN 100% ĐỘC LẬP CHO KHỐI LỚP 2 (30 CÂU/BỘ)
    // CAP 1 (1-6) | CAP 2 (7-10) | CAP 3 (11-14) | CAP 4 (15-18)
    // ========================================================
    generateGrade2Mode2Exam(roundNum, seed) {
      const cap = roundNum <= 6 ? 1 : (roundNum <= 10 ? 2 : (roundNum <= 14 ? 3 : 4));
      const questions = [];

            { q: `Dấu gạch ngang trong câu: 'Hồ Chí Minh - vị lãnh tụ thiên tài' có tác dụng gì?`, opts: ["Đánh dấu bộ phận chú thích, giải thích", "Nối các từ", "Lời nói trực tiếp", "Liệt kê"], c: 0, ex: "Đánh dấu chú thích." },
            { q: `Lê Lợi lãnh đạo cuộc khởi nghĩa nào chống quân Minh?`, opts: ["Khởi nghĩa Lam Sơn", "Khởi nghĩa Tây Sơn", "Khởi nghĩa Hai Bà Trưng", "Khởi nghĩa Ba Đình"], c: 0, ex: "Khởi nghĩa Lam Sơn." },
            { q: `Vua Quang Trung đại phá 29 vạn quân Thanh vào năm nào?`, opts: ["Năm 1789 (Kỷ Dậu)", "Năm 1288", "Năm 938", "Năm 1945"], c: 0, ex: "Năm 1789." },
            { q: `Thầy giáo Chu Văn An được tôn vinh là:`, opts: ["Vạn thế sư biểu (Thầy giáo muôn đời)", "Lưỡng quốc Trạng nguyên", "Trạng cờ", "Trạng toán"], c: 0, ex: "Vạn thế sư biểu." }
          ];
          return pools[index % pools.length];
        } else {
          const pools = [
            { q: `Câu ghép là gì:`, opts: ["Câu do nhiều vế câu ghép lại, cấu tạo chủ - vị độc lập", "Câu chỉ có một cụm chủ - vị", "Câu không có chủ ngữ", "Câu chỉ có từ đơn"], c: 0, ex: "Cấu trúc chủ - vị nhiều vế." },
            { q: `Từ nhiều nghĩa là gì:`, opts: ["Từ có nghĩa gốc và các nghĩa chuyển có liên quan mật thiết", "Từ hoàn toàn không liên quan", "Từ mượn", "Từ đơn"], c: 0, ex: "Nghĩa gốc và chuyển." },
            { q: `Biện pháp tu từ ẨN DỤ dựa trên cơ sở nào?`, opts: ["Dựa trên nét tương đồng (giống nhau) giữa các sự vật", "Dựa trên sự gần gũi", "Dựa trên sự đối lập", "Dựa trên âm thanh"], c: 0, ex: "Nét tương đồng." },
            { q: `Cách mạng Tháng Tám thành công năm nào?`, opts: ["Năm 1945", "Năm 1930", "Năm 1954", "Năm 1975"], c: 0, ex: "Năm 1945." },
            { q: `Quan hệ từ biểu thị quan hệ TĂNG TIẾN:`, opts: ["Không những... mà còn...", "Vì... nên...", "Tuy... nhưng...", "Nếu... thì..."], c: 0, ex: "Không những... mà còn..." }
          ];
          return pools[index % pools.length];
        }
      }

      for (let i = 0; i < 15; i++) {
        const item = getProceduralMCQ(grade, roundNum, seed, i);
        const opts = seededShuffle([...item.opts], baseSeed + i * 13);
        questions.push({
          id: questions.length + 1,
          type: 'MCQ',
          title: grade <= 2 ? `Đấu Trường Tiếng Việt` : (isQuocGia ? `Đấu Trường Đỉnh Cao (Quốc Gia)` : `Đấu Trường Tiếng Việt & Lịch sử`),
          question: item.q,
          options: opts,
          correctIndex: opts.indexOf(item.opts[item.c]),

        });
      }

      // --- DẠNG 2: ĐIỀN TỪ & ĐỐ CHỮ (6 CÂU) ---
      let filteredProverbs = KNOWLEDGE_BASE.proverbs;
      if (grade <= 2) {
        filteredProverbs = KNOWLEDGE_BASE.proverbs.filter(p => (p.grade || 1) <= 2);
      }
      const proverbsPool = seededShuffle(filteredProverbs, baseSeed + 500);
      proverbsPool.slice(0, 4).forEach((p, idx) => {
        questions.push({
          id: questions.length + 1,
          type: 'FILL',
          title: `Điền từ hoàn thiện Tục ngữ / Ca dao`,

          answer: p.mask,
          explain: `Câu đầy đủ: "${p.full}". Ý nghĩa: ${p.theme}.`

      });

      let filteredRiddles = KNOWLEDGE_BASE.riddles;
      if (grade <= 2) {
        filteredRiddles = KNOWLEDGE_BASE.riddles.filter(r => (r.grade || 1) <= 2);
      } else {
        filteredRiddles = KNOWLEDGE_BASE.riddles.filter(r => (r.grade || 3) >= 3);
      }
      if (filteredRiddles.length === 0) filteredRiddles = KNOWLEDGE_BASE.riddles;
      const riddlesPool = seededShuffle(filteredRiddles, baseSeed + 600);
      riddlesPool.slice(0, 2).forEach(r => {
        questions.push({
          id: questions.length + 1,

          answer: r.answer,
          explain: r.explain

      // --- DẠNG 3: NỐI CẶP TƯƠNG ỨNG (3 CẶP) ---
      if (grade >= 3) {
        const heroesPool = seededShuffle(KNOWLEDGE_BASE.heroes, baseSeed + 700);
        for (let mIdx = 0; mIdx < 3; mIdx++) {
          const subHeroes = heroesPool.slice(mIdx * 3, mIdx * 3 + 3);
          const pairs = subHeroes.map(h => ({ a: h.name, b: (h.feat || h.quote || h.title || 'Chiến công oanh liệt').substring(0, 32) + '...' }));
          questions.push({
            id: questions.length + 1,
            type: 'MATCH_MINI',
            title: `Nối Cặp: Nhân vật & Sự nghiệp`,
            instruction: 'Bấm chọn ô ở Cột A rồi bấm ô tương ứng ở Cột B:',

            explain: 'Nối đúng danh nhân / anh hùng với chiến công lịch sử tương ứng.'
          });
        }
      } else {
        for (let mIdx = 0; mIdx < 3; mIdx++) {
          const basicPairs = [
            [{ a: "Bút chì", b: "đồ dùng học tập" }, { a: "Gà trống", b: "gáy báo thức" }, { a: "Hoa sen", b: "quốc hoa Việt Nam" }],
            [{ a: "Mẹ", b: "người sinh ra em" }, { a: "Cây chuối", b: "cho quả ngọt" }, { a: "Sách vở", b: "bạn của học sinh" }],
            [{ a: "Mặt trời", b: "tỏa sáng ban ngày" }, { a: "Đêm", b: "có trăng và sao" }, { a: "Cục tẩy", b: "tẩy sạch chữ viết sai" }]
          ][mIdx];

            id: questions.length + 1,
            type: 'MATCH_MINI',
            title: `Nối Cặp: Sự vật & Ý nghĩa`,
            instruction: 'Bấm chọn ô ở Cột A rồi bấm ô tương ứng ở Cột B:',

            explain: 'Nối đúng các sự vật quen thuộc với đặc điểm tương ứng.'

      }

      // --- DẠNG 4: PHÂN LOẠI NHÓM (3 CÂU) ---
      if (grade === 1) {
        questions.push({
          id: questions.length + 1,
          type: 'CLASSIFY_MINI',
          title: `Phân loại: Đồ dùng học tập vs Con vật`,
          instruction: 'Xếp các mục vào đúng nhóm:',

      } else if (grade === 2) {

      } else if (grade === 3) {
        questions.push({

      } else if (grade === 4) {

      questions.push({
        id: questions.length + 1,

        groups: [
          { name: "Chủ ngữ", words: ["những chú chim", "em học sinh"] },

      questions.push({
        id: questions.length + 1,
        type: 'CLASSIFY_MINI',
        title: `Phân loại: Từ đồng nghĩa vs Từ trái nghĩa`,
        instruction: 'Xếp cặp từ vào đúng nhóm quan hệ:',
        groups: [
          { name: "Từ đồng nghĩa", words: ["chăm chỉ - siêng năng", "to lớn - khổng lồ"] },
          { name: "Từ trái nghĩa", words: ["dũng cảm - hèn nhát", "thành công - thất bại"] }
        ],
        explain: "Đồng nghĩa và trái nghĩa."

      // --- DẠNG 5: ĐỌC HIỂU VĂN BẢN (3 CÂU) ---
      let readingPassage = "";
      let rQ1 = "", rQ2 = "", rQ3 = "";
      let rOpts1 = [], rOpts2 = [], rOpts3 = [];
      let rEx1 = "", rEx2 = "", rEx3 = "";

      if (grade === 1) {
        readingPassage = `

        `;
        rQ1 = 'Trong đoạn thơ trên, áo của mẹ có màu gì?';
        rOpts1 = ['Trắng tinh', 'Đỏ thắm', 'Xanh ngắt', 'Vàng tươi'];
        rEx1 = 'Khổ thơ viết: "Áo mẹ trắng tinh".';
        rQ2 = 'Ai là người yêu thương bạn nhỏ nhất trong bài thơ?';
        rOpts2 = ['Mẹ', 'Cô giáo', 'Bạn bè', 'Ông bà'];
        rEx2 = 'Mẹ yêu thương nhất là cô con xinh.';
        rQ3 = 'Từ nào chỉ hoạt động đi của mẹ?';
        rOpts3 = ['Đi làm', 'Trắng tinh', 'Xinh', 'Áo'];
        rEx3 = '"Đi làm" là từ chỉ hoạt động của mẹ.';
      } else if (grade === 2) {
        readingPassage = `

          Như mây từng chùm.<br>
          <span class="text-xs text-amber-900 font-bold italic mt-1 block">(Trích 'Em yêu nhà em')</span>
        `;
        rQ1 = 'Cây gì trồng trước ngõ nhà bạn nhỏ?';
        rOpts1 = ['Hàng xoan', 'Cây bưởi', 'Cây cau', 'Cây mít'];
        rEx1 = 'Đoạn thơ nhắc đến "Hàng xoan trước ngõ".';
        rQ2 = 'Hoa xoan nở được so sánh với hình ảnh nào?';
        rOpts2 = ['Như mây từng chùm', 'Như nắng vàng', 'Như hạt ngọc', 'Như ngọn lửa'];
        rEx2 = 'Hoa xoan nở đẹp như mây từng chùm.';
        rQ3 = 'Biện pháp nghệ thuật nào được sử dụng trong câu thơ cuối?';
        rOpts3 = ['So sánh', 'Nhân hóa', 'Ẩn dụ', 'Nói quá'];
        rEx3 = 'Từ "như" thể hiện biện pháp so sánh.';
      } else if (grade === 3) {
        readingPassage = `
          Hạt gạo làng ta<br>
          Có vị phù sa<br>
          Của sông Kinh Thầy<br>
          Có hương sen thơm<br>
          Trong hồ nước đầy<br>
          Có lời mẹ hát<br>
          Ngọt bùi đắng cay...<br>
          <span class="text-xs text-amber-900 font-bold italic mt-1 block">(Trích 'Hạt gạo làng ta' - Trần Đăng Khoa)</span>
        `;
        rQ1 = 'Hạt gạo được làm nên từ những tinh hoa nào của thiên nhiên và tình cảm?';
        rOpts1 = ['Phù sa sông Kinh Thầy, hương sen thơm và lời mẹ hát', 'Chỉ từ đất bùn', 'Từ máy móc', 'Từ nước mưa'];
        rEx1 = 'Hạt gạo chứa đựng phù sa, hương sen và tình mẹ.';
        rQ2 = 'Tác giả bài thơ "Hạt gạo làng ta" là ai?';
        rOpts2 = ['Trần Đăng Khoa', 'Tô Hoài', 'Đoàn Giỏi', 'Xuân Quỳnh'];
        rEx2 = 'Nhà thơ Trần Đăng Khoa sáng tác khi còn nhỏ.';
        rQ3 = 'Biện pháp nghệ thuật lặp lại từ "Có" ở đầu các dòng thơ là gì?';
        rOpts3 = ['Điệp từ (Điệp ngữ)', 'So sánh', 'Nhân hóa', 'Nói quá'];
        rEx3 = 'Từ "Có" lặp lại tạo nhịp điệu tha thiết.';
      } else {
        readingPassage = `
          Nam quốc sơn hà Nam đế cư<br>
          Tiệt nhiên định phận tại thiên thư<br>
          Như hà nghịch lỗ lai xâm phạm<br>
          Nhữ đẳng hành khan thủ bại hư.<br>
          <span class="text-xs text-amber-900 font-bold italic mt-1 block">(Bản dịch: Sông núi nước Nam vua Nam ở / Rành rành định phận tại sách trời / Cớ sao lũ giặc sang xâm phạm / Chúng bay sẽ bị đánh tơi bời!)</span>
        `;
        rQ1 = 'Bài thơ thần "Nam quốc sơn hà" khẳng định điều thiêng liêng nào của dân tộc?';
        rOpts1 = ['Chủ quyền lãnh thổ độc lập bất khả xâm phạm', 'Vẻ đẹp các dòng sông', 'Lòng hiếu thảo', 'Sự phong phú thiên nhiên'];
        rEx1 = 'Bài thơ khẳng định chủ quyền lãnh thổ thiêng liêng.';
        rQ2 = 'Bài thơ gắn liền với vị tướng tài ba nào?';
        rOpts2 = ['Lý Thường Kiệt', 'Trần Hưng Đạo', 'Quang Trung', 'Lê Lợi'];
        rEx2 = 'Lý Thường Kiệt ngâm thơ trên sông Như Nguyệt.';
        rQ3 = 'Biện pháp nghệ thuật trong câu: "Như hà nghịch lỗ lai xâm phạm"?';
        rOpts3 = ['Câu hỏi tu từ khẳng định chính nghĩa', 'So sánh', 'Nhân hóa', 'Nói giảm'];
        rEx3 = 'Câu hỏi tu từ vạch trần tội ác giặc xâm lược.';
      }

      questions.push({
        id: questions.length + 1,
        type: 'READING',
        title: `Đọc hiểu văn bản (Câu 1)`,
        passage: readingPassage,
        question: rQ1,
        options: rOpts1,
        correctIndex: 0,
        explain: rEx1
      });

      questions.push({
        id: questions.length + 1,
        type: 'READING',
        title: `Đọc hiểu văn bản (Câu 2)`,
        passage: readingPassage,
        question: rQ2,
        options: rOpts2,
        correctIndex: 0,
        explain: rEx2
      });

      questions.push({
        id: questions.length + 1,
        type: 'READING',
        title: `Đọc hiểu văn bản (Câu 3)`,
        passage: readingPassage,
        question: rQ3,
        options: rOpts3,
        correctIndex: 0,
        explain: rEx3
      });

      const stageLabel = roundNum <= 10 
        ? 'Vòng Cơ Sở' 
        : (roundNum <= 14 
          ? 'Vòng Khu Vực' 
          : (roundNum <= 16 
            ? 'Vòng Tinh Hoa' 
            : 'Vòng Tranh Tài'));

      return {
        mode: 2,
        grade,
        roundNum,
        seed,
        title: `Đề Thi 30 Câu • Khối ${grade} • ${stageLabel}`,
        questions: questions.slice(0, 30)
      };
    }







  };

  // ==========================================
  // [WEB AUDIO API - HIỆU ỨNG ÂM THANH DÂN GIAN]
  // ==========================================
  const SoundEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    },
    playClick() {
      // Tiếng ting nhẹ nhàng êm ái khi bấm nút
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1760, t); // Note A6
      osc1.frequency.exponentialRampToValueAtTime(1320, t + 0.08);

      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(2640, t); // Harmonic ting
      osc2.frequency.exponentialRampToValueAtTime(1980, t + 0.06);

      gain.gain.setValueAtTime(0.06, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(this.ctx.destination);

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 0.12);
      osc2.stop(t + 0.12);
    },
    playDrum() {
      // Giữ alias tương thích để tất cả các nút ấn phát ra tiếng ting nhẹ nhàng
      this.playClick();
    },
    playSuccess() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t + i * 0.05);
        gain.gain.setValueAtTime(0.25, t + i * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.05 + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t + i * 0.05);
        osc.stop(t + i * 0.05 + 0.35);
      });
    },
    playGong() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      [196, 293.66, 392, 587.33].forEach(f => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 1.2);
      });
    },
    playWrong() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.linearRampToValueAtTime(110, t + 0.25);
      gain.gain.setValueAtTime(0.35, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.25);
    },
    playFanfare() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
      const t = this.ctx.currentTime;
      notes.forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t + i * 0.12);
        gain.gain.setValueAtTime(0.35, t + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.6);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t + i * 0.12);
        osc.stop(t + i * 0.12 + 0.6);
      });
    },
    playFireworkWhistle() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, t);
      osc.frequency.exponentialRampToValueAtTime(1350, t + 0.35);
      gain.gain.setValueAtTime(0.09, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.35);
    },
    playFireworkBoom() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(45, t + 0.45);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.45);
    }
  };

  function unlockLookbook(lookbookId, neededStars) {
    const lb = AVATAR_LOOKBOOKS.find(x => x.id === lookbookId);
    if (!lb) return;
    const curStars = AppState.stars || 0;
    if (curStars < neededStars) {
      SoundEngine.playWrong();
      showCustomAlert(`Bé cần thêm ${neededStars - curStars} ⭐ để đổi nhân vật ${lb.name}! Hoặc bé có thể bấm nút "🎬 Video" để mở khóa miễn phí nhé!`);
      return;
    }

    AppState.stars = curStars - neededStars;
    if (!AppState.ownedChibis) AppState.ownedChibis = [];
    if (!AppState.ownedChibis.includes(lb.id)) {
      AppState.ownedChibis.push(lb.id);
    }
    AppState.selectedChibiId = lb.id;
    AppState.avatarName = lb.name;
    if (lb.config) {
      AppState.avatarConfig = { ...lb.config };
    }
    AppState.useCustomAvatar = true;
    savePersistedState();
    SoundEngine.playFanfare();
    updateHeaderUI();
    const prevEl = document.getElementById('wardrobe-current-avatar-preview');
    if (prevEl) {
      prevEl.innerHTML = getCurrentAvatarHtml(76);

    showCustomAlert(`Tuyệt vời! Bé đã mở thành công nhân vật ${lb.name}! ⭐🎉`);

  let currentFireworksCelebrationCleanup = null;

  function playCelebrationFireworks(score, roundNum) {
    if (typeof currentFireworksCelebrationCleanup === 'function') {
      currentFireworksCelebrationCleanup();
    }

    const currentScore = (typeof score === 'number') ? score : (AppState.roundTotalScore || 300);
    const currentRound = (typeof roundNum === 'number') ? roundNum : (AppState.currentRoundNum || 7);
    const is300 = currentScore >= 300;

    const bannerTitle = is300 ? '🎆 ĐIỂM TUYỆT ĐỐI 300 / 300 🎆' : `🎆 XUẤT SẮC ĐẠT ${currentScore} / 300 ĐIỂM 🎆`;
    const bannerSubtitle = is300 ? 'CHÚC MỪNG TÂN THỦ KHOA TRẠNG NGUYÊN!' : `CHÚC MỪNG VÒNG THI CÁC CẤP • VÒNG ${currentRound}!`;

    let canvas = document.getElementById('fireworks-canvas-celebration');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'fireworks-canvas-celebration';
      canvas.style.position = 'fixed';
      canvas.style.inset = '0';
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '99999';
      document.body.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const onResize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', onResize);

    const PALETTES = [
      ['#FFD700', '#FFA500', '#FF4500', '#FFF8DC'], // Hoàng Kim
      ['#FF1E56', '#FF4E00', '#FF007F', '#FFFFFF'], // Hồng Ngọc
      ['#00F5D4', '#00BBF9', '#3B82F6', '#E0F2FE'], // Lam Ngọc
      ['#A855F7', '#EC4899', '#F43F5E', '#FAF5FF'], // Tím Thần Thoại
      ['#10B981', '#34D399', '#FBBF24', '#ECFDF5']  // Bích Ngọc
    ];

    const rockets = [];
    const particles = [];
    const goldenStars = [];

    // Tạo các ngôi sao lấp lánh rơi từ bầu trời
    for (let i = 0; i < 70; i++) {
      goldenStars.push({
        x: Math.random() * width,
        y: Math.random() * -height * 0.8,
        vy: 1.2 + Math.random() * 2.2,
        size: 3 + Math.random() * 5,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 6,
        alpha: 0.85 + Math.random() * 0.15,
        decay: 0.0012 + Math.random() * 0.0018,
        color: Math.random() > 0.4 ? '#FFD700' : '#FF4500'
      });
    }

    function launchRocket(x, targetY, paletteIndex) {
      const palette = PALETTES[paletteIndex % PALETTES.length];
      rockets.push({
        x: x || width * (0.2 + Math.random() * 0.6),
        y: height + 10,
        vx: (Math.random() - 0.5) * 2.8,
        vy: -(13 + Math.random() * 4.5),
        targetY: targetY || height * (0.12 + Math.random() * 0.32),
        palette,
        trail: []
      });
      SoundEngine.playFireworkWhistle();
    }

    function explodeRocket(x, y, palette) {
      SoundEngine.playFireworkBoom();
      const count = 90 + Math.floor(Math.random() * 45);
      const isRing = Math.random() > 0.6;
      const baseSpeed = 4 + Math.random() * 4.5;

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.2);
        const speed = isRing ? (baseSpeed * (0.85 + Math.random() * 0.3)) : (Math.random() * baseSpeed);
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: palette[Math.floor(Math.random() * palette.length)],
          alpha: 1,
          decay: 0.012 + Math.random() * 0.014,
          size: 2.5 + Math.random() * 3.5,
          gravity: 0.075,
          friction: 0.965,
          flicker: Math.random() > 0.5
        });
      }

      // Thêm chùm hoa cúc vàng rủ (willow sparks)
      for (let i = 0; i < 28; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: '#FFE234',
          alpha: 1,
          decay: 0.008 + Math.random() * 0.008,
          size: 2,
          gravity: 0.09,
          friction: 0.98,
          flicker: true
        });
      }
    }

    // Lịch trình bắn pháo hoa các đợt liên hoàn hoành tráng (Tổng cộng 13 tên lửa)
    const schedule = [
      { delay: 100, x: width * 0.25, targetY: height * 0.25, p: 0 },
      { delay: 250, x: width * 0.75, targetY: height * 0.28, p: 1 },
      { delay: 900, x: width * 0.5, targetY: height * 0.18, p: 2 },
      { delay: 1600, x: width * 0.35, targetY: height * 0.22, p: 3 },
      { delay: 1800, x: width * 0.65, targetY: height * 0.24, p: 4 },
      { delay: 2700, x: width * 0.2, targetY: height * 0.3, p: 0 },
      { delay: 2850, x: width * 0.8, targetY: height * 0.26, p: 1 },
      { delay: 3800, x: width * 0.3, targetY: height * 0.2, p: 2 },
      { delay: 3950, x: width * 0.5, targetY: height * 0.15, p: 0 },
      { delay: 4100, x: width * 0.7, targetY: height * 0.2, p: 3 },
      // Đợt đại kết thúc (Grand Finale Salvo)
      { delay: 5200, x: width * 0.25, targetY: height * 0.22, p: 1 },
      { delay: 5250, x: width * 0.5, targetY: height * 0.16, p: 0 },
      { delay: 5300, x: width * 0.75, targetY: height * 0.24, p: 4 }
    ];

    const timeouts = [];
    schedule.forEach(s => {
      const tid = setTimeout(() => launchRocket(s.x, s.targetY, s.p), s.delay);
      timeouts.push(tid);
    });

    let animId;
    const startTime = Date.now();
    const duration = 8500; // 8.5 giây trọn vẹn màn trình diễn

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Vẽ vệt khói và tên lửa đang bay lên
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.x += r.vx;
        r.y += r.vy;
        r.vy += 0.12;

        r.trail.push({ x: r.x, y: r.y });
        if (r.trail.length > 8) r.trail.shift();

        ctx.save();
        ctx.strokeStyle = '#FFA500';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let t = 0; t < r.trail.length; t++) {
          const pt = r.trail[t];
          if (t === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();

        ctx.fillStyle = '#FFF7C2';
        ctx.beginPath();
        ctx.arc(r.x, r.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (r.y <= r.targetY || r.vy >= -1) {
          explodeRocket(r.x, r.y, r.palette);
          rockets.splice(i, 1);
        }
      }

      // Vẽ các hạt pháo hoa nổ toả sáng
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= p.friction;
        p.vy *= p.friction;
        p.vy += p.gravity;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        const renderAlpha = p.flicker && Math.random() > 0.4 ? p.alpha * 0.4 : p.alpha;
        ctx.globalAlpha = Math.max(0, renderAlpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Vẽ các ngôi sao vàng rơi từ từ
      ctx.save();
      for (let i = goldenStars.length - 1; i >= 0; i--) {
        const s = goldenStars[i];
        s.y += s.vy;
        s.rotation += s.rotSpeed;
        s.alpha -= s.decay;

        if (s.alpha <= 0 || s.y > height + 20) {
          goldenStars.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.fillStyle = s.color;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate((s.rotation * Math.PI) / 180);
        ctx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
        ctx.restore();
      }
      ctx.restore();

      // Vẽ Dải Ruy Băng Vinh Danh Tuyệt Đối 300/300 trên đầu màn hình Canvas
      const elapsed = Date.now() - startTime;
      if (elapsed < 7500) {
        const bannerAlpha = Math.min(1, elapsed / 500) * (elapsed > 6000 ? (7500 - elapsed) / 1500 : 1);
        ctx.save();
        ctx.globalAlpha = bannerAlpha;
        const bannerW = Math.min(width - 32, 480);
        const bannerH = 76;
        const bannerX = (width - bannerW) / 2;
        const bannerY = Math.min(height * 0.06, 36);

        const grad = ctx.createLinearGradient(bannerX, bannerY, bannerX + bannerW, bannerY + bannerH);
        grad.addColorStop(0, '#B91C1C');
        grad.addColorStop(0.5, '#DC2626');
        grad.addColorStop(1, '#991B1B');

        ctx.shadowColor = 'rgba(255, 215, 0, 0.75)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = grad;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(bannerX, bannerY, bannerW, bannerH, 18);
        } else {
          ctx.rect(bannerX, bannerY, bannerW, bannerH);
        }
        ctx.fill();

        ctx.strokeStyle = '#FDE047';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#FEF08A';
        ctx.font = '900 16px Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(bannerTitle, width / 2, bannerY + 30);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 12px Nunito, sans-serif';
        ctx.fillText(bannerSubtitle, width / 2, bannerY + 54);
        ctx.restore();
      }

      if (Date.now() - startTime < duration) {
        animId = requestAnimationFrame(render);
      } else {
        cleanup();
      }
    }

    function cleanup() {
      if (animId) cancelAnimationFrame(animId);
      timeouts.forEach(t => clearTimeout(t));
      window.removeEventListener('resize', onResize);
      if (canvas && canvas.parentNode) {
        canvas.parentNode.removeChild(canvas);
      }
      currentFireworksCelebrationCleanup = null;
    }

    currentFireworksCelebrationCleanup = cleanup;
    render();
  }

  function playWinAnimation() {

    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'win-fireworks-canvas';
      canvas.style.position = 'fixed';

      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '9999';
      document.body.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const onResize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', onResize);

    const colors = ['#F59E0B', '#DC2626', '#10B981', '#FBBF24', '#EF4444', '#3B82F6', '#8B5CF6', '#EC4899', '#FFFBEB'];
    const particles = [];

    function createFirework(x, y) {
      const count = 40 + Math.floor(Math.random() * 25);
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 6;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          alpha: 1,
          decay: 0.012 + Math.random() * 0.015,
          size: 2.5 + Math.random() * 3,
          isSpark: true
        });
      }
    }

    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * -height * 0.6,
        vx: (Math.random() - 0.5) * 3,
        vy: 2.5 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: 0.002 + Math.random() * 0.003,
        size: 5 + Math.random() * 6,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 8,
        isSpark: false
      });
    }

    let burstCount = 0;
    const burstInterval = setInterval(() => {
      burstCount++;
      const x = width * (0.2 + Math.random() * 0.6);
      const y = height * (0.15 + Math.random() * 0.4);
      createFirework(x, y);
      if (AppState.soundEnabled) SoundEngine.playSuccess();
      if (burstCount >= 6) clearInterval(burstInterval);
    }, 380);

    let animId;
    const startTime = Date.now();

    function render() {
      ctx.clearRect(0, 0, width, height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.isSpark) {
          p.vy += 0.08;
          p.vx *= 0.98;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          p.vy += 0.04;
          p.rotation += p.rotSpeed;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
          ctx.restore();
        }

        if (p.alpha <= 0 || p.y > height + 20) {
          particles.splice(i, 1);
        }
      }

      if (Date.now() - startTime < 5500 && particles.length > 0) {
        animId = requestAnimationFrame(render);
      } else {
        cancelAnimationFrame(animId);
        clearInterval(burstInterval);
        window.removeEventListener('resize', onResize);
        if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
      }
    }
    render();
  }

  function startWithCustomSeed(roundNum) {
    const input = document.getElementById('input-custom-seed');
    const maxSeeds = getMaxSeeds(roundNum);
    let seed = parseInt(input ? input.value : '', 10);
    if (!seed || isNaN(seed) || seed < 1) seed = 1;
    if (seed > maxSeeds) seed = maxSeeds;
    startRoundExam(roundNum, seed);
  }

  // ========================================================
  // ĐIỀU PHỐI VÀO BÀI THI: LỚP 1 LÀM ĐỀ THI 30 CÂU TỰ SINH
  // ========================================================
  function startRoundExam(roundNum, chosenSeed = null) {
    const maxSeeds = getMaxSeeds(roundNum);

    // Thiết lập số đề thi
    if (chosenSeed !== null && chosenSeed !== undefined) {
      let s = parseInt(chosenSeed, 10) || 1;
      if (s > maxSeeds) s = maxSeeds;
      if (s < 1) s = 1;
      AppState.currentSeed = s;
    } else if (roundNum <= 3) {
      AppState.currentSeed = Math.floor(Math.random() * 5) + 1;
    } else {
      AppState.currentSeed = Math.floor(Math.random() * maxSeeds) + 1;
    }

    AppState.currentRoundNum = roundNum;
    AppState.roundTotalScore = 0;
    AppState.roundAnswersHistory = [];
    AppState.subGameMistakes = 0;

    closeModal();

    const fw = document.getElementById('win-fireworks-canvas');
    if (fw && fw.parentNode) fw.parentNode.removeChild(fw);

    if (AppState.timerInterval) clearInterval(AppState.timerInterval);

    const appHeader = document.getElementById('main-app-header');
    if (appHeader) appHeader.style.display = 'none';

    window.scrollTo({ top: 0, behavior: 'smooth' });

    // Chế độ 2: Vòng 7 - 18 (Phòng thi 30 câu liên hoàn); Chế độ 1: Vòng 1 - 6 (5 Mini-games liên hoàn)
    if (roundNum >= 7) {
      AppState.examMode = 2;
      AppState.timerSeconds = 1800; // 30 phút
      AppState.currentQuestionIndex = 0;
      AppState.userAnswers30 = {};
      const examData = ExamGenerator.generateMode2Exam(AppState.selectedGrade, roundNum, AppState.currentSeed);
      AppState.exam30Questions = examData.questions;

      AppState.timerInterval = setInterval(() => {
        AppState.timerSeconds--;
        updateTimerDisplay();
        if (AppState.timerSeconds <= 0) {
          clearInterval(AppState.timerInterval);
          showCustomAlert('Đã hết 30 phút làm bài! Hệ thống tự động nộp bài.');
          finishExamMode2();
        }
      }, 1000);

      SoundEngine.playGong();
      renderExamMode2Question();
    } else {
      // Chế độ 1: Vòng 1 - 6 (5 Mini-games hoạt hình liên hoàn)
      AppState.examMode = 1;
      AppState.timerSeconds = 900;
      AppState.currentSubGameIndex = 0;
      AppState.subGameScores = [0, 0, 0, 0, 0];
      AppState.currentExamMode1 = ExamGenerator.generateMode1Exam(AppState.selectedGrade, roundNum, AppState.currentSeed);

      AppState.timerInterval = setInterval(() => {
        AppState.timerSeconds--;
        updateTimerDisplay();
        if (AppState.timerSeconds <= 0) {
          clearInterval(AppState.timerInterval);
          showCustomAlert('Đã hết 15 phút làm bài! Hệ thống tự động nộp bài.');
          finishRoundExam();
        }
      }, 1000);

      SoundEngine.playGong();
      renderCurrentSubGameMode1();
    }
  }

  function updateTimerDisplay() {
    const el = document.getElementById('exam-timer');
    if (!el) return;
    const m = Math.floor(AppState.timerSeconds / 60);
    const s = AppState.timerSeconds % 60;
    el.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function confirmExitExam() {
    showCustomConfirm(
      'Bạn muốn thoát bài thi?',
      function() {
        if (AppState.timerInterval) clearInterval(AppState.timerInterval);
        if (AppState.singlePlayTickets && AppState.singlePlayTickets[AppState.currentRoundNum]) {
          delete AppState.singlePlayTickets[AppState.currentRoundNum];
          savePersistedState();
        }
        AppState.currentExamMode1 = null;
        AppState.exam30Questions = [];
        const appHeader = document.getElementById('main-app-header');
        if (appHeader) appHeader.style.display = 'block';
        closeModal();
        renderHome();
      },
      null,
      'Xác Nhận'
    );
  }

  // ========================================================
  // [BLOCK 4: ENGINE CHẾ ĐỘ 1: VÒNG TỰ LUYỆN 3 GAME (VÒNG 1 - 6)]
  // ========================================================
  function renderCurrentSubGameMode1() {
    const exam = AppState.currentExamMode1;
    const idx = AppState.currentSubGameIndex;

    if (idx >= exam.subGames.length) {
      finishRoundExam();
      return;
    }

    const currentSub = exam.subGames[idx];
    if (currentSub.type === 'NOI') {
      renderGame1_NoiO(currentSub);
    } else if (currentSub.type === 'PL') {
      renderGame2_PhanLoai(currentSub);
    } else if (currentSub.type === 'TN_DT') {
      renderGame3_QuizMode1(currentSub);
    } else if (currentSub.type === 'DO_VUI') {
      renderGame4_RiddlesMode1(currentSub);
    } else if (currentSub.type === 'NHIN_HINH') {
      renderGame5_ImageQuizMode1(currentSub);
    }
  }

  // GAME 1: BÉ TINH MẮT (BỐ TRÍ 2 CỘT: CỘT BÊN TRÁI NỐI VỚI CỘT BÊN PHẢI)
  function renderGame1_NoiO(subGame) {
    const root = document.getElementById('app-root');
    const pairs = subGame.data.pairs;
    AppState.subGameMistakes = 0;

    const totalPairs = Math.min(10, pairs.length);
    const activePairs = pairs.slice(0, totalPairs);

    // Cột Bên Trái (Cột A)
    const colA = activePairs.map((p, pIdx) => ({
      id: `a_${pIdx}`,
      text: p.a,
      pairId: pIdx
    }));

    // Cột Bên Phải (Cột B) - Được hoán vị ngẫu nhiên
    const colB = activePairs.map((p, pIdx) => ({
      id: `b_${pIdx}`,
      text: p.b,
      pairId: pIdx
    })).sort(() => Math.random() - 0.5);

    let selectedLeft = null;
    let selectedRight = null;
    let matchedCount = 0;

    root.innerHTML = `
      ${getExamHeaderMode1(subGame.title)}
      <div class="scroll-card p-3 sm:p-5">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3 text-xs sm:text-sm">
          <p class="text-slate-700 font-semibold flex items-center gap-1.5">
            <span>💡</span>
            <span>Chọn 1 ô ở <b>Cột Bên Trái</b> rồi nối với 1 ô tương ứng ở <b>Cột Bên Phải</b>.</span>
          </p>
          <div class="flex items-center gap-2 self-end sm:self-auto">
            <span class="text-xs font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-300">
              Đã nối: <b id="match-progress">0</b>/${totalPairs}
            </span>
            <span class="text-xs font-bold text-red-600 bg-red-50 px-2.5 py-1 rounded-full border border-red-200">
              Sai: <b id="mistake-count">0</b>/3
            </span>
          </div>
        </div>

        <!-- BỐ TRÍ 2 CỘT RÕ RÀNG: TRÁI VÀ PHẢI -->
        <div class="grid grid-cols-2 gap-2.5 sm:gap-4 my-2" id="meo-con-grid">
          <!-- CỘT BÊN TRÁI -->
          <div class="flex flex-col gap-2" id="col-left">
            <div class="text-center font-black text-xs sm:text-sm text-red-900 bg-red-100/90 py-1.5 px-2 rounded-xl border border-red-300 shadow-sm flex items-center justify-center gap-1.5">
              <span>🐾</span>
              <span>CỘT BÊN TRÁI</span>
            </div>
            ${colA.map(item => `
              <button data-id="${item.id}" data-col="A" data-pair="${item.pairId}" class="cat-tile scroll-card p-2.5 sm:p-3 text-center text-xs sm:text-sm font-bold border-2 border-amber-300 bg-amber-50/70 hover:bg-amber-100 text-slate-800 rounded-xl transition-all shadow-sm flex items-center justify-between gap-1">
                <span class="flex-1 text-center">${item.text}</span>
                <span class="status-icon text-xs hidden">✓</span>
              </button>
            `).join('')}
          </div>

          <!-- CỘT BÊN PHẢI -->
          <div class="flex flex-col gap-2" id="col-right">
            <div class="text-center font-black text-xs sm:text-sm text-amber-950 bg-amber-200/90 py-1.5 px-2 rounded-xl border border-amber-300 shadow-sm flex items-center justify-center gap-1.5">
              <span>🐱</span>
              <span>CỘT BÊN PHẢI</span>
            </div>
            ${colB.map(item => `
              <button data-id="${item.id}" data-col="B" data-pair="${item.pairId}" class="cat-tile scroll-card p-2.5 sm:p-3 text-center text-xs sm:text-sm font-bold border-2 border-amber-300 bg-amber-50/70 hover:bg-amber-100 text-slate-800 rounded-xl transition-all shadow-sm flex items-center justify-between gap-1">
                <span class="flex-1 text-center">${item.text}</span>
                <span class="status-icon text-xs hidden">✓</span>
              </button>
            `).join('')}
          </div>
        </div>
      </div>
    `;

    const container = document.getElementById('meo-con-grid');
    container.addEventListener('click', (e) => {
      const btn = e.target.closest('.cat-tile');
      if (!btn || btn.classList.contains('matched')) return;

      SoundEngine.playClick();
      const col = btn.dataset.col;

      if (col === 'A') {
        if (selectedLeft === btn) {
          btn.classList.remove('selected', 'ring-4', 'ring-amber-400', 'bg-amber-200');
          selectedLeft = null;
          return;
        }
        if (selectedLeft) {
          selectedLeft.classList.remove('selected', 'ring-4', 'ring-amber-400', 'bg-amber-200');
        }
        selectedLeft = btn;
        btn.classList.add('selected', 'ring-4', 'ring-amber-400', 'bg-amber-200');
      } else {
        if (selectedRight === btn) {
          btn.classList.remove('selected', 'ring-4', 'ring-amber-400', 'bg-amber-200');
          selectedRight = null;
          return;
        }
        if (selectedRight) {
          selectedRight.classList.remove('selected', 'ring-4', 'ring-amber-400', 'bg-amber-200');
        }
        selectedRight = btn;
        btn.classList.add('selected', 'ring-4', 'ring-amber-400', 'bg-amber-200');
      }

      // Khi người dùng đã chọn cả 1 ô bên Trái và 1 ô bên Phải -> Tiến hành đối chiếu nối cặp
      if (selectedLeft && selectedRight) {
        const leftTile = selectedLeft;
        const rightTile = selectedRight;
        selectedLeft = null;
        selectedRight = null;

        leftTile.classList.remove('selected', 'ring-4', 'ring-amber-400', 'bg-amber-200');
        rightTile.classList.remove('selected', 'ring-4', 'ring-amber-400', 'bg-amber-200');

        if (leftTile.dataset.pair === rightTile.dataset.pair) {
          // NỐI ĐÚNG CẶP
          SoundEngine.playSuccess();
          leftTile.classList.add('matched', 'bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'opacity-80', 'pointer-events-none');
          rightTile.classList.add('matched', 'bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'opacity-80', 'pointer-events-none');

          const iconL = leftTile.querySelector('.status-icon');
          if (iconL) { iconL.classList.remove('hidden'); iconL.className = 'status-icon text-xs font-black text-emerald-700'; }
          const iconR = rightTile.querySelector('.status-icon');
          if (iconR) { iconR.classList.remove('hidden'); iconR.className = 'status-icon text-xs font-black text-emerald-700'; }

          matchedCount++;
          const progressEl = document.getElementById('match-progress');
          if (progressEl) progressEl.textContent = matchedCount;

          const currentTotal = AppState.roundTotalScore + Math.round((matchedCount / totalPairs) * 100);
          const scoreEl = document.getElementById('exam-score');
          if (scoreEl) scoreEl.textContent = `${currentTotal} / 300`;

          AppState.roundAnswersHistory.push({
            game: 'Bé tinh mắt',
            question: `${leftTile.textContent.replace('✓', '').trim()} 🔗 ${rightTile.textContent.replace('✓', '').trim()}`,
            isCorrect: true,
            explain: 'Nối đúng cặp vế tương ứng giữa cột Trái và cột Phải.'
          });

          if (matchedCount >= totalPairs) {
            const earned = 100;
            AppState.subGameScores[0] = earned;
            AppState.roundTotalScore += earned;
            setTimeout(() => showInterstitialAd(() => nextSubGameMode1()), 600);
          }
        } else {
          // NỐI SAI CẶP
          SoundEngine.playWrong();
          AppState.subGameMistakes++;
          const mistakeEl = document.getElementById('mistake-count');
          if (mistakeEl) mistakeEl.textContent = AppState.subGameMistakes;

          leftTile.classList.add('wrong-shake', 'border-red-500', 'bg-red-100');
          rightTile.classList.add('wrong-shake', 'border-red-500', 'bg-red-100');
          setTimeout(() => {
            leftTile.classList.remove('wrong-shake', 'border-red-500', 'bg-red-100');
            rightTile.classList.remove('wrong-shake', 'border-red-500', 'bg-red-100');
          }, 450);

          if (AppState.subGameMistakes >= 3) {
            showCustomAlert('Bạn đã nối sai 3 lần! Hệ thống tự động chuyển sang bài tiếp theo.');
            const earned = Math.round((matchedCount / totalPairs) * 100);
            AppState.subGameScores[0] = earned;
            AppState.roundTotalScore += earned;
            showInterstitialAd(() => nextSubGameMode1());
          }
        }
      }
    });

    safeCreateIcons();
  }

  // GAME 2: BÉ THÔNG MINH
  function renderGame2_PhanLoai(subGame) {
    const root = document.getElementById('app-root');
    const baskets = subGame.data.baskets;
    const allWords = [];
    baskets.forEach((b, bIdx) => {
      b.words.forEach(w => allWords.push({ text: w, basketIndex: bIdx }));
    });
    allWords.sort(() => Math.random() - 0.5);

    let activeWord = null;
    let placedCount = 0;
    const totalWords = allWords.length;
    let mistakes = 0;

    root.innerHTML = `
      ${getExamHeaderMode1(subGame.title)}
      <div class="scroll-card p-4 sm:p-5">
        <div class="mb-3 text-xs sm:text-sm text-slate-600 font-medium">
          💡 Chọn một từ bên dưới rồi bấm vào đúng <b>Chiếc Giỏ</b> tương ứng.
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
          ${baskets.map((b, idx) => `
            <div data-basket-idx="${idx}" class="basket-zone scroll-card p-3 border-2 border-dashed border-amber-400 rounded-2xl flex flex-col cursor-pointer hover:border-emerald-500">
              <div class="flex items-center gap-1.5 pb-2 border-b border-amber-200">
                <span class="text-xl">🧺</span>
                <span class="font-extrabold text-sm text-red-900">${b.name}</span>
              </div>
              <div class="placed-words flex flex-wrap gap-1.5 mt-2 flex-1 items-start"></div>
            </div>
          `).join('')}
        </div>

        <div class="p-3 bg-amber-100/60 rounded-2xl border border-amber-300">
          <div class="text-xs font-bold text-amber-950 mb-2">Từ cần xếp vào giỏ:</div>
          <div class="flex flex-wrap gap-2" id="words-pool">
            ${allWords.map((item, i) => `
              <button data-word-idx="${i}" data-correct-basket="${item.basketIndex}" class="pool-word btn-3d bg-white hover:bg-amber-50 text-slate-800 text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl border border-amber-300">
                ${item.text}
              </button>
            `).join('')}
          </div>
        </div>
      </div>
    `;

    const pool = document.getElementById('words-pool');
    const basketEls = document.querySelectorAll('.basket-zone');

    pool.addEventListener('click', (e) => {
      const btn = e.target.closest('.pool-word');
      if (!btn) return;
      SoundEngine.playDrum();
      document.querySelectorAll('.pool-word').forEach(b => b.classList.remove('ring-4', 'ring-amber-500', 'bg-amber-200'));
      activeWord = btn;
      btn.classList.add('ring-4', 'ring-amber-500', 'bg-amber-200');
    });

    basketEls.forEach(bEl => {
      bEl.addEventListener('click', () => {
        if (!activeWord) {
          showCustomAlert('Vui lòng chọn từ phía dưới trước!');
          return;
        }

        const chosenBasket = parseInt(bEl.dataset.basketIdx, 10);
        const correctBasket = parseInt(activeWord.dataset.correctBasket, 10);
        const wordText = activeWord.textContent.trim();

        if (chosenBasket === correctBasket) {
          SoundEngine.playSuccess();
          const tag = document.createElement('span');
          tag.className = 'bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs px-2 py-0.5 rounded-lg font-bold animate-bounce';
          tag.textContent = wordText;
          bEl.querySelector('.placed-words').appendChild(tag);

          AppState.roundAnswersHistory.push({
            game: 'Bé thông minh',
            question: `Phân loại từ "${wordText}" vào nhóm "${baskets[chosenBasket].name}"`,
            userAnswer: baskets[chosenBasket].name,
            correctAnswer: baskets[correctBasket].name,
            isCorrect: true,
            explain: baskets[chosenBasket].explain || 'Phân loại từ vựng chính xác vào đúng nhóm kiến thức.'
          });

          activeWord.remove();
          activeWord = null;
          placedCount++;

          if (placedCount >= totalWords) {
            const score = Math.max(40, 100 - mistakes * 10);
            AppState.subGameScores[1] = score;
            AppState.roundTotalScore += score;
            setTimeout(() => showInterstitialAd(() => nextSubGameMode1()), 600);
          }
        } else {
          SoundEngine.playWrong();
          mistakes++;
          bEl.classList.add('wrong-shake');
          setTimeout(() => bEl.classList.remove('wrong-shake'), 400);
        }
      });
    });
    safeCreateIcons();
  }

  // GAME 3: BÉ HỌC VUI & BÉ SÁNG TẠO
  function renderGame3_QuizMode1(subGame) {
    const root = document.getElementById('app-root');
    const questions = subGame.data;
    let qIdx = 0;
    let correctCount = 0;

    function showQ() {
      if (qIdx >= questions.length) {
        const score = Math.round((correctCount / questions.length) * 100);
        AppState.subGameScores[2] = score;
        AppState.roundTotalScore += score;
        showInterstitialAd(() => nextSubGameMode1());
        return;
      }

      const q = questions[qIdx];
      if (q.type === 'DT') {
        root.innerHTML = `
          ${getExamHeaderMode1(subGame.title)}
          <div class="scroll-card p-5 max-w-xl mx-auto">
            <div class="text-xs font-bold text-amber-800 mb-2">Câu hỏi ${qIdx + 1} / ${questions.length} • Điền từ còn thiếu</div>
            <div class="p-4 bg-amber-50 rounded-xl border border-amber-200 mb-4 text-center font-bold text-base text-slate-800">
              ${q.question.replace('[...]', '<span class="text-red-600 underline font-black">[ ... ]</span>')}
            </div>
            <form id="mode1-fill-form" class="flex gap-2">
              <input type="text" id="mode1-input" class="flex-1 px-4 py-2 border-2 border-amber-400 rounded-xl text-center font-bold" placeholder="Nhập từ còn thiếu..." autofocus autocomplete="off">
              <button type="submit" class="btn-3d btn-3d-green text-white px-5 py-2 rounded-xl font-bold">Nộp</button>
            </form>
          </div>
        `;
        document.getElementById('mode1-fill-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const val = document.getElementById('mode1-input').value.trim();
          const isRight = (val.toLowerCase() === q.answer.toLowerCase());
          if (isRight) {
            SoundEngine.playSuccess();
            correctCount++;
          } else {
            SoundEngine.playWrong();
          }
          AppState.roundAnswersHistory.push({
            game: 'Bé học vui',
            question: q.question,
            userAnswer: val || 'Chưa nhập',
            correctAnswer: q.answer,
            isCorrect: isRight,
            explain: q.explain || 'Kiến thức cốt lõi chuẩn GDPT 2018.'
          });
          qIdx++;
          showQ();
        });
      } else {
        root.innerHTML = `
          ${getExamHeaderMode1(subGame.title)}
          <div class="scroll-card p-5 max-w-xl mx-auto">
            <div class="text-xs font-bold text-amber-800 mb-2">Câu hỏi ${qIdx + 1} / ${questions.length} • Trắc nghiệm</div>
            <h3 class="font-extrabold text-base text-slate-800 mb-4">${q.question}</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" id="mode1-opts">
              ${q.options.map((opt, i) => `
                <button data-opt-idx="${i}" class="scroll-card p-3 text-left border-2 border-amber-200 hover:border-red-500 rounded-xl font-bold text-xs sm:text-sm">
                  ${String.fromCharCode(65 + i)}. ${opt}
                </button>
              `).join('')}
            </div>
          </div>
        `;
        document.getElementById('mode1-opts').addEventListener('click', (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;
          const chosen = parseInt(btn.dataset.optIdx, 10);
          const isRight = (chosen === q.correctIndex);
          if (isRight) {
            SoundEngine.playSuccess();
            correctCount++;
          } else {
            SoundEngine.playWrong();
          }
          AppState.roundAnswersHistory.push({
            game: 'Bé sáng tạo',
            question: q.question,
            userAnswer: (q.options && q.options[chosen] !== undefined) ? q.options[chosen] : '',
            correctAnswer: (q.options && q.options[q.correctIndex] !== undefined) ? q.options[q.correctIndex] : '',
            isCorrect: isRight,
            explain: q.explain || 'Kiến thức cốt lõi chuẩn GDPT 2018.'
          });
          qIdx++;
          showQ();
        });
      }
      safeCreateIcons();
    }
    showQ();
  }
