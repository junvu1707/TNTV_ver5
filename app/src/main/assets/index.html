  // ========================================================
  // [KẾT THÚC & CHẤM ĐIỂM ĐỀ THI TỔNG HỢP 30 CÂU]
  // ========================================================
  function finishExamMode2() {
    if (AppState.timerInterval) clearInterval(AppState.timerInterval);

    let correctCount = 0;
    const history = [];

    AppState.exam30Questions.forEach((q, idx) => {
      const userAns = AppState.userAnswers30[idx];
      let isCorrect = false;

      if (q.type === 'MCQ' || q.type === 'READING') {
        isCorrect = (userAns === q.correctIndex);
      } else if (q.type === 'FILL') {
        isCorrect = (userAns && userAns.toLowerCase().trim() === q.answer.toLowerCase().trim());
      } else {
        // MATCH_MINI hoặc CLASSIFY_MINI
        isCorrect = (userAns !== undefined);
      }

      if (isCorrect) correctCount++;
      const userText = (userAns !== undefined && userAns !== null && userAns !== '') 
        ? (typeof userAns === 'object' ? 'Đã hoàn thành' : ((q.options && q.options[userAns] !== undefined) ? q.options[userAns] : String(userAns)))
        : 'Chưa làm';
      const correctText = (q.options && q.options[q.correctIndex] !== undefined) 
        ? q.options[q.correctIndex] 
        : (q.answer || 'Đáp án chuẩn');

      history.push({
        game: `Câu ${idx + 1}: ${q.title || 'Kiến thức'}`,
        question: q.question || q.title || 'Câu hỏi kiến thức',
        userAnswer: userText,
        correctAnswer: correctText,
        isCorrect,
        explain: q.explain || 'Kiến thức trọng tâm chuẩn GDPT 2018.'
      });
    });

    AppState.roundTotalScore = correctCount * 10;
    AppState.roundAnswersHistory = history;
    finishRoundExam();
  }

  // ========================================================
  // ========================================================
  // [TỔNG KẾT VÒNG THI & VINH DANH TRẠNG NGUYÊN]
  // ========================================================
  function finishRoundExam() {
    if (AppState.timerInterval) clearInterval(AppState.timerInterval);

    // Hiện lại Header của ứng dụng khi đã hoàn thành bài thi
    const appHeader = document.getElementById('main-app-header');
    if (appHeader) appHeader.style.display = 'block';
    closeModal();

    // Tính toán thời gian làm bài thực tế
    const totalTimeLimit = AppState.examMode === 2 ? 1800 : 900;
    const timeSpent = Math.max(1, totalTimeLimit - AppState.timerSeconds);
    const spentMinutes = Math.floor(timeSpent / 60);
    const spentSeconds = timeSpent % 60;
    const timeString = `${spentMinutes} phút ${spentSeconds.toString().padStart(2, '0')} giây`;

    // So sánh chuẩn hóa điểm số (0 đến 300)
    const total = Math.max(0, Math.min(300, AppState.roundTotalScore || 0));
    let rankTitle = 'Học Sĩ Chăm Chỉ';
    let rankBadge = '📜';
    let rankColor = 'from-slate-600 to-amber-700';
    // Điểm qua các vòng thi là số sao nhận được (theo đúng yêu cầu của người dùng)
    const starReward = total;

    // Vòng 4-18 khi học sinh đạt điểm trên 250 (từ 250 đến 300) sẽ kích hoạt hiệu ứng pháo hoa chúc mừng hoành tráng
    const isRound4To18 = AppState.currentRoundNum >= 4 && AppState.currentRoundNum <= 18;
    const isPerfect300 = (total === 300);

    if (total === 300) {
      rankTitle = 'Thủ Khoa Trạng Nhí';
      rankBadge = '👑';
      rankColor = 'from-amber-500 via-red-600 to-amber-500';
      if (isRound4To18) {
        showHonorBoardPopup(AppState.studentName, total, AppState.currentRoundNum, () => {
          playCelebrationFireworks(total, AppState.currentRoundNum);
        });
      } else {
        playWinAnimation();
      }
    } else if (total >= 280) {
      rankTitle = 'Siêu Trạng Nhí';
      rankBadge = '🥇';
      rankColor = 'from-amber-500 via-red-600 to-amber-600';
      if (isRound4To18) {
        showHonorBoardPopup(AppState.studentName, total, AppState.currentRoundNum, () => {
          playCelebrationFireworks(total, AppState.currentRoundNum);
        });
      } else {
        playWinAnimation();
      }
    } else if (total >= 250) {
      rankTitle = 'Trạng Thông Thái';
      rankBadge = '🥈';
      rankColor = 'from-amber-600 to-red-600';

          </div>
          <p class="text-xs text-slate-600 mt-3 font-semibold">Bé đã hoàn thành xuất sắc chặng thi vừa rồi!</p>
          <button id="btn-close-interstitial" disabled class="mt-4 w-full py-2.5 rounded-xl font-black text-sm bg-slate-200 text-slate-500 transition-all">
            Đóng quảng cáo sau (${countdown}s)
          </button>
        </div>
      </div>
    `;

    const btn = document.getElementById('btn-close-interstitial');
    const timer = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        if (btn) btn.textContent = `Đóng quảng cáo sau (${countdown}s)`;
      } else {
        clearInterval(timer);
        if (btn) {
          btn.disabled = false;
          btn.className = 'btn-3d btn-3d-red mt-4 w-full py-2.5 rounded-xl font-black text-sm text-white';
          btn.textContent = 'Tiếp Tục Làm Bài ➔';
          btn.onclick = () => {
            closeModal();
            if (typeof onClosed === 'function') onClosed();
          };
        }
      }
    }, 1000);
  }

  // --- REWARDED VIDEO ADS ---

  function startRewardedAdForRound(roundNum) {
    if (window.AndroidBridge && typeof window.AndroidBridge.requestRewardedAd === 'function') {
      window.AndroidBridge.requestRewardedAd('round', roundNum);
    }
    runWebFallbackRewarded('round', roundNum);
  }

  function watchRewardedAdForStars(amount = 30) {
    if (window.AndroidBridge && typeof window.AndroidBridge.requestRewardedAd === 'function') {
      window.AndroidBridge.requestRewardedAd('stars', amount);
    }
    runWebFallbackRewarded('stars', amount);
  }

  function watchRewardedAdForExplanation() {
    if (window.AndroidBridge && typeof window.AndroidBridge.requestRewardedAd === 'function') {
      window.AndroidBridge.requestRewardedAd('explanation', 1);
    }
    runWebFallbackRewarded('explanation', 1);
  }

  // Hook nhận callback thưởng từ Android Native AdMob SDK
  window.onRewardedAdSuccess = function(rewardType, targetId) {
    closeModal();
    if (rewardType === 'round') {
      if (!AppState.singlePlayTickets) AppState.singlePlayTickets = {};
      AppState.singlePlayTickets[targetId] = true;
      savePersistedState();
      SoundEngine.playSuccess();
      showCustomAlert(`🎉 Bạn đã nhận được 1 lượt thi Vòng ${targetId}! Hãy cùng bắt đầu thi nào.`);
      startRoundExam(targetId);
    } else if (rewardType === 'stars') {
      const added = parseInt(targetId, 10) || 30;
      AppState.stars = (AppState.stars || 0) + added;
      savePersistedState();
      SoundEngine.playSuccess();
      updateHeaderUI();
      const starsEl = document.getElementById('wardrobe-stars-count');
      if (starsEl) starsEl.textContent = AppState.stars;
      showCustomAlert(`🎉 Chúc mừng bạn đã nhận thêm +${added} ⭐ vào Tủ Đồ Chibi!`);
    } else if (rewardType === 'chibi') {
      if (!AppState.ownedChibis) AppState.ownedChibis = [];
      if (!AppState.ownedChibis.includes(targetId)) {
        AppState.ownedChibis.push(targetId);
      }
      const lb = AVATAR_LOOKBOOKS.find(x => x.id === targetId);
      if (lb) {
        AppState.selectedChibiId = lb.id;
        AppState.currentAvatarImage = lb.image;
        AppState.avatarName = lb.name;
        AppState.useCustomAvatar = false;
      }
      savePersistedState();
      SoundEngine.playFanfare();
      updateHeaderUI();
      openAvatarModal('lookbook');
      showCustomAlert(`🎉 Chúc mừng bạn đã xem video và mở khóa thành công nhân vật ${lb ? lb.name : ''}!`);
    } else if (rewardType === 'item') {
      const parts = String(targetId).split(':');
      const cat = parts[0];
      const itemId = parts[1];
      if (!AppState.ownedItems) AppState.ownedItems = [];
      if (!AppState.ownedItems.includes(itemId)) {
        AppState.ownedItems.push(itemId);
      }
      if (!AppState.avatarConfig) {
        AppState.avatarConfig = { hair: 'hair_trang_thong_thai', outfit: 'outfit_trang_thong_thai', accessory: 'acc_but_long' };
      }
      AppState.avatarConfig[cat] = itemId;
      AppState.useCustomAvatar = true;
      savePersistedState();
      SoundEngine.playFanfare();
      updateHeaderUI();
      openAvatarModal(cat);
      showCustomAlert(`🎉 Chúc mừng bạn đã xem video và nhận thành công trang phục mới!`);
    } else if (rewardType === 'explanation') {
      AppState.isVip1 = true;
      savePersistedState();
      SoundEngine.playSuccess();
      finishRoundExam();
    }
  };

  window.onRewardedAdFallback = function(rewardType, targetId) {
    // Trình phát dự phòng nếu chưa có kết nối AdMob SDK
  };

  function runWebFallbackRewarded(rewardType, targetId) {
    let countdown = 5;
    const modalContainer = document.getElementById('modal-container');
    const titleText = rewardType === 'round' ? `Mở 1 Lượt Thi Vòng ${targetId}`
      : rewardType === 'stars' ? `Nhận +${targetId} ⭐ Tủ Đồ Chibi`
      : rewardType === 'chibi' ? `Mở Khóa Nhân Vật Chibi Mới`
      : rewardType === 'item' ? `Mở Khóa Trang Phục Mới`
      : 'Mở Khóa Lời Giải Chi Tiết';

    modalContainer.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="bg-slate-900 text-white rounded-2xl max-w-sm w-full p-5 text-center relative border border-amber-400/50 shadow-2xl">
          <div class="flex items-center justify-between text-xs text-amber-300 font-bold mb-3">
            <span>🎬 GOOGLE ADMOB REWARDED VIDEO</span>
            <span id="rewarded-timer" class="bg-red-600 text-white px-2 py-0.5 rounded-full font-black">5s</span>
          </div>
          <div class="h-40 bg-slate-800 rounded-xl flex flex-col items-center justify-center p-4 border border-slate-700">
            <span class="text-4xl mb-2 animate-bounce">🎁</span>
            <div class="font-extrabold text-sm text-yellow-300">${titleText}</div>
            <div class="text-xs text-slate-400 mt-1">Vui lòng xem hết để nhận phần thưởng</div>
          </div>
          <div class="w-full bg-slate-700 h-2 rounded-full mt-4 overflow-hidden">
            <div id="reward-progress" class="bg-amber-400 h-full transition-all duration-1000" style="width: 0%"></div>
          </div>
        </div>
      </div>
    `;

    const timer = setInterval(() => {
      countdown--;
      const timerEl = document.getElementById('rewarded-timer');
      const progressEl = document.getElementById('reward-progress');
      if (timerEl) timerEl.textContent = `${countdown}s`;
      if (progressEl) progressEl.style.width = `${((5 - countdown) / 5) * 100}%`;

      if (countdown <= 0) {
        clearInterval(timer);
        window.onRewardedAdSuccess(rewardType, targetId);
      }
    }, 1000);
  }

  function closeModal() {
    const modal = document.getElementById('modal-container');
    if (modal) modal.innerHTML = '';
  }

  function showCustomAlert(message, title = 'Thông Báo') {
    if (typeof SoundEngine !== 'undefined' && SoundEngine.playClick) SoundEngine.playClick();
    const modalContainer = document.getElementById('modal-container');
    if (!modalContainer) return;

    modalContainer.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="scroll-card max-w-sm w-full p-5 bg-white border-2 border-amber-400 relative text-center shadow-2xl">
          <div class="text-3xl mb-2">📜</div>
          <h3 class="text-base font-black text-red-900 uppercase mb-2">${title}</h3>
          <p class="text-sm font-extrabold text-slate-800 mb-5 leading-relaxed">${message}</p>
          <button onclick="closeModal()" class="btn-3d btn-3d-gold px-6 py-2.5 rounded-xl font-black text-amber-950 text-sm shadow">
            Đồng ý
          </button>
        </div>
      </div>
    `;
    if (typeof lucide !== 'undefined' && lucide.createIcons) safeCreateIcons();
  }

  function showCustomConfirm(message, onConfirm, onCancel, title = 'Xác Nhận') {
    if (typeof SoundEngine !== 'undefined' && SoundEngine.playClick) SoundEngine.playClick();
    const modalContainer = document.getElementById('modal-container');
    if (!modalContainer) return;

    window._onCustomConfirmYes = function() {
      closeModal();
      if (typeof onConfirm === 'function') onConfirm();
    };

    window._onCustomConfirmNo = function() {
      closeModal();
      if (typeof onCancel === 'function') onCancel();
    };

    modalContainer.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="scroll-card max-w-sm w-full p-5 bg-white border-2 border-amber-400 relative text-center shadow-2xl">
          <div class="text-3xl mb-2">📜</div>
          <h3 class="text-base font-black text-red-900 uppercase mb-2">${title}</h3>
          <p class="text-base font-extrabold text-slate-800 mb-6 leading-relaxed">${message}</p>
          <div class="flex gap-3 justify-center">
            <button onclick="window._onCustomConfirmYes()" class="btn-3d btn-3d-red flex-1 py-2.5 rounded-xl font-black text-white text-sm shadow">
              Có
            </button>
            <button onclick="window._onCustomConfirmNo()" class="btn-3d px-5 py-2.5 rounded-xl font-extrabold text-slate-700 bg-slate-200 hover:bg-slate-300 text-sm">
              Không
            </button>
          </div>
        </div>
      </div>
    `;
    if (typeof lucide !== 'undefined' && lucide.createIcons) safeCreateIcons();
  }

  // Ghi đè alert & confirm hệ thống để không bao giờ xuất hiện dòng "The page at file..."
  window.alert = function(msg) {
    showCustomAlert(msg);
  };

  window.confirm = function(msg) {
    if (msg && (msg.includes('thoát') || msg.includes('bài thi') || msg.includes('rời khỏi'))) {
      confirmExitExam();
      return false;
    }
    return true;
  };

  window.handleAndroidBack = function() {
    // Nếu đang trong bài thi / vòng thi
    if (AppState.currentExamMode1 || (AppState.exam30Questions && AppState.exam30Questions.length > 0)) {
      confirmExitExam();
      return;
    }
    // Nếu đang mở modal
    const modalContainer = document.getElementById('modal-container');
    if (modalContainer && modalContainer.children.length > 0) {
      closeModal();
      return;
    }
    // Nếu đang ở màn hình con khác
    if (AppState.currentScreen && AppState.currentScreen !== 'HOME') {
      renderHome();
      return;
    }
    // Ngược lại thoát app
    if (typeof AndroidBridge !== 'undefined' && AndroidBridge.exitApp) {
      AndroidBridge.exitApp();
    }
  };

  // Khởi động
  window.addEventListener('DOMContentLoaded', () => {
    loadPersistedState();
    renderHome();
  });
  </script>
</body>
</html>
