  <!-- ========================================== -->
  <!-- [BLOCK 1: CSS & UI STYLES] -->
  <!-- ========================================== -->
  <style>
    /* Hoạ tiết vân mây trống đồng và giấy điệp dân gian */
    html {
      background-color: #FEF3C7;
    }
    body {
      background-color: #FEF3C7;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.15) 0%, transparent 75%),
        radial-gradient(circle at 100% 100%, rgba(220, 38, 38, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(5, 150, 105, 0.08) 0%, transparent 50%);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Hiệu ứng nổi 3D cho các nút bấm thiếu nhi */
    .btn-3d {
      transition: all 0.1s ease-in-out;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    }
    .btn-3d:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }
    .btn-3d-gold {
      background: linear-gradient(180deg, #FBBF24 0%, #D97706 100%);
      box-shadow: 0 4px 0 #92400E;
    }
    .btn-3d-gold:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #92400E;
    }
    .btn-3d-red {
      background: linear-gradient(180deg, #EF4444 0%, #B91C1C 100%);
      box-shadow: 0 4px 0 #7F1D1D;
    }
    .btn-3d-red:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7F1D1D;
    }
    .btn-3d-green {
      background: linear-gradient(180deg, #34D399 0%, #059669 100%);
      box-shadow: 0 4px 0 #064E3B;
    }
    .btn-3d-green:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #064E3B;
    }
    .btn-3d-blue {
      background: linear-gradient(180deg, #60A5FA 0%, #2563EB 100%);
      box-shadow: 0 4px 0 #1E40AF;
    }
    .btn-3d-blue:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1E40AF;
    }

    /* Thẻ bài phong cách khoa cử truyền thống */
    .scroll-card {
      background: #FFFFFF;
      border: 3px solid #FCD34D;
      box-shadow: 0 8px 16px -2px rgba(217, 119, 6, 0.15);
      border-radius: 1.25rem;
    }

    /* Nút giỏ phân loại Bé thông minh */
    .basket-zone {
      min-height: 100px;
      transition: all 0.2s ease;
      background: linear-gradient(180deg, #FFFBEB 0%, #FEF3C7 100%);
    }
    .basket-zone.highlight {
      border-color: #059669;
      background: #D1FAE5;
      transform: scale(1.02);
    }

    /* Thẻ ghép đôi Bé tinh mắt */
    .match-tile {
      min-height: 52px;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }
    .match-tile.selected {
      background-color: #FEF08A !important;
      border-color: #CA8A04 !important;
      transform: scale(1.04);
      box-shadow: 0 0 12px rgba(202, 138, 4, 0.4);
    }
    .match-tile.matched {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .match-tile.wrong-shake {
      animation: shake 0.4s ease-in-out;
      background-color: #FEE2E2 !important;
      border-color: #DC2626 !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Nút điều hướng 30 câu hỏi của Đề thi Tổng hợp */
    .q-nav-pill {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1.5px solid #CBD5E1;
      background: #F8FAFC;
      color: #475569;
    }
    .q-nav-pill.active {
      background: #F59E0B !important;
      color: #78350F !important;
      border-color: #B45309 !important;
      transform: scale(1.12);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      z-index: 10;
    }
    .q-nav-pill.answered {
      background: #10B981;
      color: #FFFFFF;
      border-color: #047857;
    }

    /* Trống đồng SVG làm họa tiết trang trí */
    .dong-son-pattern {
      background-image: radial-gradient(#F59E0B 1px, transparent 1px), radial-gradient(#DC2626 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      opacity: 0.12;
    }
  </style>
</head>

  // PRNG (Hàm băm ngẫu nhiên có hạt giống deterministic)
  function seededRandom(seed) {
    const x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  // Thuật toán sinh hoán vị ngẫu nhiên có hạt giống
  function seededShuffle(arr, seed) {
    const res = [...arr];
    let s = seed;
    for (let i = res.length - 1; i > 0; i--) {
      s++;
      const j = Math.floor(seededRandom(s) * (i + 1));
      [res[i], res[j]] = [res[j], res[i]];
    }
    return res;
  }

  // Tiện ích lọc bỏ tiền tố "Lớp ... - Cấp ..."
  function formatQuestionTitle(title) {
    if (!title) return '';
    return title
      .replace(/^Lớp\s*\d+\s*[•\-–:]\s*(Cấp\s*\d+\s*:\s*)?/i, '')
      .replace(/^Cấp\s*\d+\s*:\s*/i, '')
      .trim();
  }

  // Tiện ích chuẩn hóa nội dung câu hỏi để nhận diện câu trùng
  function normalizeQuestionKey(text) {
    if (!text) return '';
    return text.toLowerCase()
      .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'"\[\]]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Tiện ích gom nhóm variants và chọn câu hỏi độc nhất 100% cho từng số đề
  function selectUniqueQuestionsForExam(pool, targetCount, seed) {
    if (!pool || pool.length === 0) return [];
    const grouped = new Map();
    for (const item of pool) {
      const qText = item.q || item.question || item.poem || item.passage || '';
      const key = normalizeQuestionKey(qText);
      if (!grouped.has(key)) {
        grouped.set(key, []);
      }
      grouped.get(key).push(item);
    }

    const uniqueList = [];
    let idx = 0;
    for (const [key, variants] of grouped.entries()) {
      const chosenVariant = variants[(seed - 1 + idx) % variants.length];
      uniqueList.push(chosenVariant);
      idx++;
    }

    const shuffled = seededShuffle(uniqueList, seed * 1000 + targetCount * 31);
    return shuffled.slice(0, targetCount);
  }

  // [WEB AUDIO API - HIỆU ỨNG ÂM THANH DÂN GIAN]
  // ==========================================
  const SoundEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    },
    playClick() {
      // Tiếng ting nhẹ nhàng êm ái khi bấm nút
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1760, t); // Note A6
      osc1.frequency.exponentialRampToValueAtTime(1320, t + 0.08);

      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(2640, t); // Harmonic ting
      osc2.frequency.exponentialRampToValueAtTime(1980, t + 0.06);

      gain.gain.setValueAtTime(0.06, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(this.ctx.destination);

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 0.12);
      osc2.stop(t + 0.12);
    },
    playDrum() {
      // Giữ alias tương thích để tất cả các nút ấn phát ra tiếng ting nhẹ nhàng
      this.playClick();
    },
    playSuccess() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t + i * 0.05);
        gain.gain.setValueAtTime(0.25, t + i * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.05 + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t + i * 0.05);
        osc.stop(t + i * 0.05 + 0.35);
      });
    },
    playGong() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      [196, 293.66, 392, 587.33].forEach(f => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 1.2);
      });
    },
    playWrong() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.linearRampToValueAtTime(110, t + 0.25);
      gain.gain.setValueAtTime(0.35, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.25);
    },
    playFanfare() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
      const t = this.ctx.currentTime;
      notes.forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t + i * 0.12);
        gain.gain.setValueAtTime(0.35, t + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.6);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t + i * 0.12);
        osc.stop(t + i * 0.12 + 0.6);
      });
    },
    playFireworkWhistle() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, t);
      osc.frequency.exponentialRampToValueAtTime(1350, t + 0.35);
      gain.gain.setValueAtTime(0.09, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.35);
    },
    playFireworkBoom() {
      if (!AppState.soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(45, t + 0.45);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.45);
    }
  };

    // Tài khoản Admin uyenlp1310 (đã xác thực pass Vudung177.) mở khóa TẤT CẢ các vòng để test bộ câu hỏi
    if (isAdminAccount()) return true;
    // Vòng 1 đến 3 hoàn toàn miễn phí cho mọi tài khoản học sinh & giáo viên
    if (roundNum <= 3) return true;

    return !!(AppState.singlePlayTickets && AppState.singlePlayTickets[roundNum]);

  let currentFireworksCelebrationCleanup = null;

  function showHonorBoardPopup(studentName, score, roundNum, onComplete) {
    const existing = document.getElementById('honor-board-popup');
    if (existing && existing.parentNode) existing.parentNode.removeChild(existing);

    const honorDiv = document.createElement('div');
    honorDiv.id = 'honor-board-popup';
    honorDiv.style.position = 'fixed';
    honorDiv.style.top = '20px';
    honorDiv.style.left = '50%';
    honorDiv.style.transform = 'translateX(-50%)';
    honorDiv.style.zIndex = '999999';
    honorDiv.className = 'animate-bounce';
    honorDiv.innerHTML = `
      <div class="bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-amber-950 px-6 py-3 rounded-2xl shadow-2xl border-4 border-white flex items-center gap-3">
        <div class="text-3xl">🏆</div>
        <div>
          <div class="text-[11px] font-black uppercase tracking-wider text-amber-900">Bảng Vinh Danh • Vòng ${roundNum}</div>
          <div class="text-base sm:text-lg font-black">${escapeHtml(studentName)} - ${score} / 300 điểm</div>
        </div>
        <div class="ml-2 bg-red-600 text-white text-xs font-black px-2 py-1 rounded-full animate-pulse" id="honor-countdown">3s</div>
      </div>
    `;
    document.body.appendChild(honorDiv);

    let timeLeft = 3;
    const interval = setInterval(() => {
      timeLeft--;
      const cd = document.getElementById('honor-countdown');
      if (cd) cd.textContent = timeLeft + 's';
      if (timeLeft <= 0) {
        clearInterval(interval);
        if (honorDiv && honorDiv.parentNode) {
          honorDiv.parentNode.removeChild(honorDiv);
        }
        if (typeof onComplete === 'function') onComplete();
      }
    }, 1000);
  }

  function playCelebrationFireworks(score, roundNum) {
    if (typeof currentFireworksCelebrationCleanup === 'function') {
      currentFireworksCelebrationCleanup();
    }

    const currentScore = (typeof score === 'number') ? score : (AppState.roundTotalScore || 300);
    const currentRound = (typeof roundNum === 'number') ? roundNum : (AppState.currentRoundNum || 7);
    const is300 = currentScore >= 300;

    const bannerTitle = is300 ? '🎆 ĐIỂM TUYỆT ĐỐI 300 / 300 🎆' : `🎆 XUẤT SẮC ĐẠT ${currentScore} / 300 ĐIỂM 🎆`;
    const bannerSubtitle = is300 ? 'CHÚC MỪNG TÂN THỦ KHOA TRẠNG NGUYÊN!' : `CHÚC MỪNG VÒNG THI CÁC CẤP • VÒNG ${currentRound}!`;

    let canvas = document.getElementById('fireworks-canvas-celebration');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'fireworks-canvas-celebration';
      canvas.style.position = 'fixed';
      canvas.style.inset = '0';
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '99999';
      document.body.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const onResize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', onResize);

    const PALETTES = [
      ['#FFD700', '#FFA500', '#FF4500', '#FFF8DC'], // Hoàng Kim
      ['#FF1E56', '#FF4E00', '#FF007F', '#FFFFFF'], // Hồng Ngọc
      ['#00F5D4', '#00BBF9', '#3B82F6', '#E0F2FE'], // Lam Ngọc
      ['#A855F7', '#EC4899', '#F43F5E', '#FAF5FF'], // Tím Thần Thoại
      ['#10B981', '#34D399', '#FBBF24', '#ECFDF5']  // Bích Ngọc
    ];

    const rockets = [];
    const particles = [];
    const goldenStars = [];

    // Tạo các ngôi sao lấp lánh rơi từ bầu trời
    for (let i = 0; i < 70; i++) {
      goldenStars.push({
        x: Math.random() * width,
        y: Math.random() * -height * 0.8,
        vy: 1.2 + Math.random() * 2.2,
        size: 3 + Math.random() * 5,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 6,
        alpha: 0.85 + Math.random() * 0.15,
        decay: 0.0012 + Math.random() * 0.0018,
        color: Math.random() > 0.4 ? '#FFD700' : '#FF4500'
      });
    }

    function launchRocket(x, targetY, paletteIndex) {
      const palette = PALETTES[paletteIndex % PALETTES.length];
      rockets.push({
        x: x || width * (0.2 + Math.random() * 0.6),
        y: height + 10,
        vx: (Math.random() - 0.5) * 2.8,
        vy: -(13 + Math.random() * 4.5),
        targetY: targetY || height * (0.12 + Math.random() * 0.32),
        palette,
        trail: []
      });
      SoundEngine.playFireworkWhistle();
    }

    function explodeRocket(x, y, palette) {
      SoundEngine.playFireworkBoom();
      const count = 90 + Math.floor(Math.random() * 45);
      const isRing = Math.random() > 0.6;
      const baseSpeed = 4 + Math.random() * 4.5;

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.2);
        const speed = isRing ? (baseSpeed * (0.85 + Math.random() * 0.3)) : (Math.random() * baseSpeed);
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: palette[Math.floor(Math.random() * palette.length)],
          alpha: 1,
          decay: 0.012 + Math.random() * 0.014,
          size: 2.5 + Math.random() * 3.5,
          gravity: 0.075,
          friction: 0.965,
          flicker: Math.random() > 0.5
        });
      }

      // Thêm chùm hoa cúc vàng rủ (willow sparks)
      for (let i = 0; i < 28; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: '#FFE234',
          alpha: 1,
          decay: 0.008 + Math.random() * 0.008,
          size: 2,
          gravity: 0.09,
          friction: 0.98,
          flicker: true
        });
      }
    }

    // Lịch trình bắn pháo hoa các đợt liên hoàn hoành tráng (Tổng cộng 13 tên lửa)
    const schedule = [
      { delay: 100, x: width * 0.25, targetY: height * 0.25, p: 0 },
      { delay: 250, x: width * 0.75, targetY: height * 0.28, p: 1 },
      { delay: 900, x: width * 0.5, targetY: height * 0.18, p: 2 },
      { delay: 1600, x: width * 0.35, targetY: height * 0.22, p: 3 },
      { delay: 1800, x: width * 0.65, targetY: height * 0.24, p: 4 },
      { delay: 2700, x: width * 0.2, targetY: height * 0.3, p: 0 },
      { delay: 2850, x: width * 0.8, targetY: height * 0.26, p: 1 },
      { delay: 3800, x: width * 0.3, targetY: height * 0.2, p: 2 },
      { delay: 3950, x: width * 0.5, targetY: height * 0.15, p: 0 },
      { delay: 4100, x: width * 0.7, targetY: height * 0.2, p: 3 },
      // Đợt đại kết thúc (Grand Finale Salvo)
      { delay: 5200, x: width * 0.25, targetY: height * 0.22, p: 1 },
      { delay: 5250, x: width * 0.5, targetY: height * 0.16, p: 0 },
      { delay: 5300, x: width * 0.75, targetY: height * 0.24, p: 4 }
    ];

    const timeouts = [];
    schedule.forEach(s => {
      const tid = setTimeout(() => launchRocket(s.x, s.targetY, s.p), s.delay);
      timeouts.push(tid);
    });

    let animId;
    const startTime = Date.now();
    const duration = 8500; // 8.5 giây trọn vẹn màn trình diễn

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Vẽ vệt khói và tên lửa đang bay lên
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.x += r.vx;
        r.y += r.vy;
        r.vy += 0.12;

        r.trail.push({ x: r.x, y: r.y });
        if (r.trail.length > 8) r.trail.shift();

        ctx.save();
        ctx.strokeStyle = '#FFA500';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let t = 0; t < r.trail.length; t++) {
          const pt = r.trail[t];
          if (t === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();

        ctx.fillStyle = '#FFF7C2';
        ctx.beginPath();
        ctx.arc(r.x, r.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (r.y <= r.targetY || r.vy >= -1) {
          explodeRocket(r.x, r.y, r.palette);
          rockets.splice(i, 1);
        }
      }

      // Vẽ các hạt pháo hoa nổ toả sáng
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= p.friction;
        p.vy *= p.friction;
        p.vy += p.gravity;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        const renderAlpha = p.flicker && Math.random() > 0.4 ? p.alpha * 0.4 : p.alpha;
        ctx.globalAlpha = Math.max(0, renderAlpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Vẽ các ngôi sao vàng rơi từ từ
      ctx.save();
      for (let i = goldenStars.length - 1; i >= 0; i--) {
        const s = goldenStars[i];
        s.y += s.vy;
        s.rotation += s.rotSpeed;
        s.alpha -= s.decay;

        if (s.alpha <= 0 || s.y > height + 20) {
          goldenStars.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.fillStyle = s.color;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate((s.rotation * Math.PI) / 180);
        ctx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
        ctx.restore();
      }
      ctx.restore();

      // Vẽ Dải Ruy Băng Vinh Danh Tuyệt Đối 300/300 trên đầu màn hình Canvas
      const elapsed = Date.now() - startTime;
      if (elapsed < 7500) {
        const bannerAlpha = Math.min(1, elapsed / 500) * (elapsed > 6000 ? (7500 - elapsed) / 1500 : 1);
        ctx.save();
        ctx.globalAlpha = bannerAlpha;
        const bannerW = Math.min(width - 32, 480);
        const bannerH = 76;
        const bannerX = (width - bannerW) / 2;
        const bannerY = Math.min(height * 0.06, 36);

        const grad = ctx.createLinearGradient(bannerX, bannerY, bannerX + bannerW, bannerY + bannerH);
        grad.addColorStop(0, '#B91C1C');
        grad.addColorStop(0.5, '#DC2626');
        grad.addColorStop(1, '#991B1B');

        ctx.shadowColor = 'rgba(255, 215, 0, 0.75)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = grad;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(bannerX, bannerY, bannerW, bannerH, 18);
        } else {
          ctx.rect(bannerX, bannerY, bannerW, bannerH);
        }
        ctx.fill();

        ctx.strokeStyle = '#FDE047';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#FEF08A';
        ctx.font = '900 16px Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(bannerTitle, width / 2, bannerY + 30);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 12px Nunito, sans-serif';
        ctx.fillText(bannerSubtitle, width / 2, bannerY + 54);
        ctx.restore();
      }

      if (Date.now() - startTime < duration) {
        animId = requestAnimationFrame(render);
      } else {
        cleanup();
      }
    }

    function cleanup() {
      if (animId) cancelAnimationFrame(animId);
      timeouts.forEach(t => clearTimeout(t));
      window.removeEventListener('resize', onResize);
      if (canvas && canvas.parentNode) {
        canvas.parentNode.removeChild(canvas);
      }
      currentFireworksCelebrationCleanup = null;
    }

    currentFireworksCelebrationCleanup = cleanup;
    render();
  }

  function playWinAnimation() {
    let canvas = document.getElementById('win-fireworks-canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'win-fireworks-canvas';
      canvas.style.position = 'fixed';
      canvas.style.inset = '0';
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '9999';
      document.body.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const onResize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', onResize);

    const colors = ['#F59E0B', '#DC2626', '#10B981', '#FBBF24', '#EF4444', '#3B82F6', '#8B5CF6', '#EC4899', '#FFFBEB'];
    const particles = [];

    function createFirework(x, y) {
      const count = 40 + Math.floor(Math.random() * 25);
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 6;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          alpha: 1,
          decay: 0.012 + Math.random() * 0.015,
          size: 2.5 + Math.random() * 3,
          isSpark: true
        });
      }
    }

    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * -height * 0.6,
        vx: (Math.random() - 0.5) * 3,
        vy: 2.5 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: 0.002 + Math.random() * 0.003,
        size: 5 + Math.random() * 6,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 8,
        isSpark: false
      });
    }

    let burstCount = 0;
    const burstInterval = setInterval(() => {
      burstCount++;
      const x = width * (0.2 + Math.random() * 0.6);
      const y = height * (0.15 + Math.random() * 0.4);
      createFirework(x, y);
      if (AppState.soundEnabled) SoundEngine.playSuccess();
      if (burstCount >= 6) clearInterval(burstInterval);
    }, 380);

    let animId;
    const startTime = Date.now();

    function render() {
      ctx.clearRect(0, 0, width, height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.isSpark) {
          p.vy += 0.08;
          p.vx *= 0.98;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          p.vy += 0.04;
          p.rotation += p.rotSpeed;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
          ctx.restore();
        }

        if (p.alpha <= 0 || p.y > height + 20) {
          particles.splice(i, 1);
        }
      }

      if (Date.now() - startTime < 5500 && particles.length > 0) {
        animId = requestAnimationFrame(render);
      } else {
        cancelAnimationFrame(animId);
        clearInterval(burstInterval);
        window.removeEventListener('resize', onResize);
        if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
      }
    }
    render();
  }

  function getMaxSeeds(roundNum) {
    if (roundNum <= 3) return 5;

    if (roundNum <= 14) return 70;
    if (roundNum <= 18) return 100;
    return 50;

  function startWithCustomSeed(roundNum) {
    const input = document.getElementById('input-custom-seed');
    const maxSeeds = getMaxSeeds(roundNum);
    let seed = parseInt(input ? input.value : '', 10);
    if (!seed || isNaN(seed) || seed < 1) seed = 1;
    if (seed > maxSeeds) seed = maxSeeds;
    startRoundExam(roundNum, seed);
  }

  // ========================================================
  // ĐIỀU PHỐI VÀO BÀI THI: LỚP 1 LÀM ĐỀ THI 30 CÂU TỰ SINH
  // ========================================================
  function startRoundExam(roundNum, chosenSeed = null) {
    const maxSeeds = getMaxSeeds(roundNum);

    // Thiết lập số đề thi
    if (chosenSeed !== null && chosenSeed !== undefined) {
      let s = parseInt(chosenSeed, 10) || 1;
      if (s > maxSeeds) s = maxSeeds;
      if (s < 1) s = 1;
      AppState.currentSeed = s;
    } else if (roundNum <= 3) {
      AppState.currentSeed = Math.floor(Math.random() * 5) + 1;
    } else {
      AppState.currentSeed = Math.floor(Math.random() * maxSeeds) + 1;
    }

    AppState.currentRoundNum = roundNum;
    AppState.roundTotalScore = 0;
    AppState.roundAnswersHistory = [];
    AppState.subGameMistakes = 0;

    closeModal();

    const fw = document.getElementById('win-fireworks-canvas');
    if (fw && fw.parentNode) fw.parentNode.removeChild(fw);

    if (AppState.timerInterval) clearInterval(AppState.timerInterval);

    const appHeader = document.getElementById('main-app-header');
    if (appHeader) appHeader.style.display = 'none';

    window.scrollTo({ top: 0, behavior: 'smooth' });

    // Chế độ 2: Vòng 7 - 18 (Phòng thi 30 câu liên hoàn); Chế độ 1: Vòng 1 - 6 (5 Mini-games liên hoàn)
    if (roundNum >= 7) {
      AppState.examMode = 2;
      AppState.timerSeconds = 1800; // 30 phút
      AppState.currentQuestionIndex = 0;
      AppState.userAnswers30 = {};
      const examData = ExamGenerator.generateMode2Exam(AppState.selectedGrade, roundNum, AppState.currentSeed);
      AppState.exam30Questions = examData.questions;

      AppState.timerInterval = setInterval(() => {
        AppState.timerSeconds--;
        updateTimerDisplay();
        if (AppState.timerSeconds <= 0) {
          clearInterval(AppState.timerInterval);
          showCustomAlert('Đã hết 30 phút làm bài! Hệ thống tự động nộp bài.');
          finishExamMode2();
        }
      }, 1000);

      SoundEngine.playGong();
      renderExamMode2Question();
    } else {
      // Chế độ 1: Vòng 1 - 6 (5 Mini-games hoạt hình liên hoàn)
      AppState.examMode = 1;
      AppState.timerSeconds = 900;
      AppState.currentSubGameIndex = 0;
      AppState.subGameScores = [0, 0, 0, 0, 0];
      AppState.currentExamMode1 = ExamGenerator.generateMode1Exam(AppState.selectedGrade, roundNum, AppState.currentSeed);

      AppState.timerInterval = setInterval(() => {
        AppState.timerSeconds--;
        updateTimerDisplay();
        if (AppState.timerSeconds <= 0) {
          clearInterval(AppState.timerInterval);
          showCustomAlert('Đã hết 15 phút làm bài! Hệ thống tự động nộp bài.');
          finishRoundExam();
        }
      }, 1000);

      SoundEngine.playGong();
      renderCurrentSubGameMode1();
    }
  }

  function updateTimerDisplay() {
    const el = document.getElementById('exam-timer');
    if (!el) return;
    const m = Math.floor(AppState.timerSeconds / 60);
    const s = AppState.timerSeconds % 60;
    el.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function confirmExitExam() {
    showCustomConfirm(
      'Bạn muốn thoát bài thi?',
      function() {
        if (AppState.timerInterval) clearInterval(AppState.timerInterval);
        if (AppState.singlePlayTickets && AppState.singlePlayTickets[AppState.currentRoundNum]) {
          delete AppState.singlePlayTickets[AppState.currentRoundNum];
          savePersistedState();
        }
        AppState.currentExamMode1 = null;
        AppState.exam30Questions = [];
        const appHeader = document.getElementById('main-app-header');
        if (appHeader) appHeader.style.display = 'block';
        closeModal();
        renderHome();
      },
      null,
      'Xác Nhận'
    );
  }

  function renderCurrentSubGameMode1() {
    const exam = AppState.currentExamMode1;
    const idx = AppState.currentSubGameIndex;

    if (idx >= exam.subGames.length) {
      finishRoundExam();
      return;
    }

    const currentSub = exam.subGames[idx];
    if (currentSub.type === 'NOI') {
      renderGame1_NoiO(currentSub);
    } else if (currentSub.type === 'PL') {
      renderGame2_PhanLoai(currentSub);
    } else if (currentSub.type === 'TN_DT') {
      renderGame3_QuizMode1(currentSub);
    } else if (currentSub.type === 'DO_VUI') {
      renderGame4_RiddlesMode1(currentSub);
    } else if (currentSub.type === 'NHIN_HINH') {
      renderGame5_ImageQuizMode1(currentSub);
    }
  }

          const iconR = rightTile.querySelector('.status-icon');

  function renderGame2_PhanLoai(subGame) {
    const root = document.getElementById('app-root');
    const baskets = subGame.data.baskets.map(b => ({

    root.innerHTML = `

          ${baskets.map((b, idx) => `
            <div data-basket-idx="${idx}" class="basket-zone scroll-card p-3 border-2 border-dashed border-amber-400 rounded-2xl flex flex-col cursor-pointer hover:border-emerald-500">

          <div class="flex flex-wrap gap-2" id="words-pool">

              <button data-word-idx="${i}" data-correct-basket="${item.basketIndex}" class="pool-word btn-3d bg-white hover:bg-amber-50 text-slate-800 text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl border border-amber-300">
                ${item.text}
              </button>
            `).join('')}
          </div>
        </div>

        <!-- Nút Nộp Bài & Nút Bài Tiếp Theo -->

          <button onclick="finishRoundExam()" class="btn-3d btn-3d-gold px-3.5 py-2 rounded-xl font-black text-amber-950 text-xs sm:text-sm shadow">

            <span>Bài Tiếp Theo</span>
            <span>►</span>
          </button>
        </div>
      </div>
    `;

    const pool = document.getElementById('words-pool');
    const basketEls = document.querySelectorAll('.basket-zone');

    pool.addEventListener('click', (e) => {
      const btn = e.target.closest('.pool-word');
      if (!btn) return;
      SoundEngine.playDrum();
      document.querySelectorAll('.pool-word').forEach(b => b.classList.remove('ring-4', 'ring-amber-500', 'bg-amber-200'));
      activeWord = btn;
      btn.classList.add('ring-4', 'ring-amber-500', 'bg-amber-200');
    });

    basketEls.forEach(bEl => {
      bEl.addEventListener('click', () => {
        if (!activeWord) {
          showCustomAlert('Vui lòng chọn từ phía dưới trước!');
          return;
        }

        const chosenBasket = parseInt(bEl.dataset.basketIdx, 10);
        const correctBasket = parseInt(activeWord.dataset.correctBasket, 10);
        const wordText = activeWord.textContent.trim();

        if (chosenBasket === correctBasket) {
          SoundEngine.playSuccess();
          const tag = document.createElement('span');
          tag.className = 'bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs px-2 py-0.5 rounded-lg font-bold animate-bounce';
          tag.textContent = wordText;
          bEl.querySelector('.placed-words').appendChild(tag);

          AppState.roundTotalScore += 10;
          const scoreEl = document.getElementById('exam-score');
          if (scoreEl) scoreEl.textContent = `${AppState.roundTotalScore} / 300`;

          AppState.roundAnswersHistory.push({
            game: 'Bé thông minh',
            question: `Phân loại từ "${wordText}" vào nhóm "${baskets[chosenBasket].name}"`,
            userAnswer: baskets[chosenBasket].name,
            correctAnswer: baskets[correctBasket].name,
            isCorrect: true,
            explain: baskets[chosenBasket].explain || 'Phân loại từ vựng chính xác vào đúng nhóm kiến thức.'
          });

          activeWord.remove();
          activeWord = null;
          placedCount++;

          if (placedCount >= totalWords) {
            setTimeout(() => showInterstitialAd(() => nextSubGameMode1()), 600);
          }
        } else {
          SoundEngine.playWrong();
          mistakes++;
          bEl.classList.add('wrong-shake');
          setTimeout(() => bEl.classList.remove('wrong-shake'), 400);
        }
      });
    });
    safeCreateIcons();
  }

  // ========================================================
  // [KẾT THÚC & CHẤM ĐIỂM ĐỀ THI TỔNG HỢP 30 CÂU]
  // ========================================================
  function finishExamMode2() {
    if (AppState.timerInterval) clearInterval(AppState.timerInterval);

    let correctCount = 0;
    const history = [];

    AppState.exam30Questions.forEach((q, idx) => {
      const userAns = AppState.userAnswers30[idx];
      let isCorrect = false;

      if (q.type === 'MCQ' || q.type === 'READING') {
        isCorrect = (userAns === q.correctIndex);
      } else if (q.type === 'FILL') {
        isCorrect = (userAns && userAns.toLowerCase().trim() === q.answer.toLowerCase().trim());
      } else {
        // MATCH_MINI hoặc CLASSIFY_MINI
        isCorrect = (userAns !== undefined);
      }

      if (isCorrect) correctCount++;
      const userText = (userAns !== undefined && userAns !== null && userAns !== '') 
        ? (typeof userAns === 'object' ? 'Đã hoàn thành' : ((q.options && q.options[userAns] !== undefined) ? q.options[userAns] : String(userAns)))
        : 'Chưa làm';
      const correctText = (q.options && q.options[q.correctIndex] !== undefined) 
        ? q.options[q.correctIndex] 
        : (q.answer || 'Đáp án chuẩn');

      history.push({
        game: `Câu ${idx + 1}: ${q.title || 'Kiến thức'}`,
        question: q.question || q.title || 'Câu hỏi kiến thức',
        userAnswer: userText,
        correctAnswer: correctText,
        isCorrect,
        explain: q.explain || 'Kiến thức trọng tâm chuẩn GDPT 2018.'
      });
    });

    AppState.roundTotalScore = correctCount * 10;
    AppState.roundAnswersHistory = history;
    finishRoundExam();
  }

    const timeString = `${spentMinutes} phút ${spentSeconds.toString().padStart(2, '0')} giây`;

    let rankColor = 'from-slate-600 to-amber-700';

  window._interstitialPendingCallback = null;

  function showInterstitialAd(onClosed) {
    if (AppState.isVip2) {
      if (typeof onClosed === 'function') onClosed();
      return;
    }
    window._interstitialPendingCallback = onClosed;

      window.AndroidBridge.requestInterstitialAd();

  function runWebFallbackInterstitial(onClosed) {
    const modalContainer = document.getElementById('modal-container');
    let countdown = 3;

    modalContainer.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 text-center relative overflow-hidden shadow-2xl border-2 border-amber-300">

            Đóng quảng cáo sau (${countdown}s)
          </button>
        </div>
      </div>
    `;

    const btn = document.getElementById('btn-close-interstitial');
    const timer = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        if (btn) btn.textContent = `Đóng quảng cáo sau (${countdown}s)`;
      } else {
        clearInterval(timer);
        if (btn) {
          btn.disabled = false;
          btn.className = 'btn-3d btn-3d-red mt-4 w-full py-2.5 rounded-xl font-black text-sm text-white';
          btn.textContent = 'Tiếp Tục Làm Bài ➔';
          btn.onclick = () => {
            closeModal();
            if (typeof onClosed === 'function') onClosed();
          };
        }
      }
    }, 1000);
  }

  // Hook nhận callback thưởng từ Android Native AdMob SDK
  window.onRewardedAdSuccess = function(rewardType, targetId) {
    closeModal();
    if (rewardType === 'round') {
      if (!AppState.singlePlayTickets) AppState.singlePlayTickets = {};
      AppState.singlePlayTickets[targetId] = true;
      savePersistedState();
      SoundEngine.playSuccess();
      showCustomAlert(`🎉 Bạn đã nhận được 1 lượt thi Vòng ${targetId}! Hãy cùng bắt đầu thi nào.`);
      startRoundExam(targetId);
    } else if (rewardType === 'stars') {
      const added = parseInt(targetId, 10) || 30;
      AppState.stars = (AppState.stars || 0) + added;
      savePersistedState();
      SoundEngine.playSuccess();
      updateHeaderUI();
      const starsEl = document.getElementById('wardrobe-stars-count');
      if (starsEl) starsEl.textContent = AppState.stars;
      showCustomAlert(`🎉 Chúc mừng bạn đã nhận thêm +${added} ⭐ vào Tủ Đồ Chibi!`);
    } else if (rewardType === 'chibi') {
      if (!AppState.ownedChibis) AppState.ownedChibis = [];
      if (!AppState.ownedChibis.includes(targetId)) {
        AppState.ownedChibis.push(targetId);
      }
      const lb = AVATAR_LOOKBOOKS.find(x => x.id === targetId || (targetId === 'chibi_trang_thong_thai' && x.id === 'chibi_co_be_de_thuong'));
      if (lb) {
        AppState.selectedChibiId = lb.id;
        AppState.currentAvatarImage = lb.image;
        AppState.avatarName = lb.name;
        AppState.useCustomAvatar = false;
      }
      savePersistedState();
      SoundEngine.playFanfare();
      updateHeaderUI();
      openAvatarModal('lookbook');
      showCustomAlert(`🎉 Chúc mừng bạn đã xem video và mở khóa thành công nhân vật ${lb ? lb.name : ''}!`);
    } else if (rewardType === 'item') {
      const parts = String(targetId).split(':');
      const cat = parts[0];
      const itemId = parts[1];
      if (!AppState.ownedItems) AppState.ownedItems = [];
      if (!AppState.ownedItems.includes(itemId)) {
        AppState.ownedItems.push(itemId);
      }
      if (!AppState.avatarConfig) {
        AppState.avatarConfig = { hair: 'hair_suon_hoa', outfit: 'outfit_ao_dai_hoa', accessory: 'acc_no_cai_toc' };
      }
      AppState.avatarConfig[cat] = itemId;
      AppState.useCustomAvatar = true;
      AppState.avatarName = 'Bé Trạng';
      savePersistedState();
      SoundEngine.playFanfare();
      updateHeaderUI();
      openAvatarModal(cat);
      showCustomAlert(`🎉 Chúc mừng bạn đã xem video và nhận thành công trang phục mới! (Nhân vật sẽ đổi sang Bé Trạng)`);
    } else if (rewardType === 'explanation') {
      AppState.isVip1 = true;
      savePersistedState();
      SoundEngine.playSuccess();
      finishRoundExam();
    }
  };

  window.onRewardedAdFallback = function(rewardType, targetId) {
    // Trình phát dự phòng nếu chưa có kết nối AdMob SDK
  };

  function runWebFallbackRewarded(rewardType, targetId) {
    let countdown = 5;
    const modalContainer = document.getElementById('modal-container');
    const titleText = rewardType === 'round' ? `Mở 1 Lượt Thi Vòng ${targetId}`
      : rewardType === 'stars' ? `Nhận +${targetId} ⭐ Tủ Đồ Chibi`
      : rewardType === 'chibi' ? `Mở Khóa Nhân Vật Chibi Mới`
      : rewardType === 'item' ? `Mở Khóa Trang Phục Mới`
      : 'Mở Khóa Lời Giải Chi Tiết';

    modalContainer.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="bg-slate-900 text-white rounded-2xl max-w-sm w-full p-5 text-center relative border border-amber-400/50 shadow-2xl">
          <div class="flex items-center justify-between text-xs text-amber-300 font-bold mb-3">
            <span>🎬 GOOGLE ADMOB REWARDED VIDEO</span>
            <span id="rewarded-timer" class="bg-red-600 text-white px-2 py-0.5 rounded-full font-black">5s</span>
          </div>
          <div class="h-40 bg-slate-800 rounded-xl flex flex-col items-center justify-center p-4 border border-slate-700">
            <span class="text-4xl mb-2 animate-bounce">🎁</span>
            <div class="font-extrabold text-sm text-yellow-300">${titleText}</div>
            <div class="text-xs text-slate-400 mt-1">Vui lòng xem hết để nhận phần thưởng</div>
          </div>
          <div class="w-full bg-slate-700 h-2 rounded-full mt-4 overflow-hidden">
            <div id="reward-progress" class="bg-amber-400 h-full transition-all duration-1000" style="width: 0%"></div>
          </div>
        </div>
      </div>
    `;

    const timer = setInterval(() => {
      countdown--;
      const timerEl = document.getElementById('rewarded-timer');
      const progressEl = document.getElementById('reward-progress');
      if (timerEl) timerEl.textContent = `${countdown}s`;
      if (progressEl) progressEl.style.width = `${((5 - countdown) / 5) * 100}%`;

      if (countdown <= 0) {
        clearInterval(timer);
        window.onRewardedAdSuccess(rewardType, targetId);
      }
    }, 1000);
  }

  function closeModal() {
    const modal = document.getElementById('modal-container');
    if (modal) modal.innerHTML = '';
  }

  function showCustomAlert(message, title = 'Thông Báo') {
    if (typeof SoundEngine !== 'undefined' && SoundEngine.playClick) SoundEngine.playClick();
    const modalContainer = document.getElementById('modal-container');
    if (!modalContainer) return;

    modalContainer.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="scroll-card max-w-sm w-full p-5 bg-white border-2 border-amber-400 relative text-center shadow-2xl">
          <div class="text-3xl mb-2">📜</div>
          <h3 class="text-base font-black text-red-900 uppercase mb-2">${title}</h3>
          <p class="text-sm font-extrabold text-slate-800 mb-5 leading-relaxed">${message}</p>
          <button onclick="closeModal()" class="btn-3d btn-3d-gold px-6 py-2.5 rounded-xl font-black text-amber-950 text-sm shadow">
            Đồng ý
          </button>
        </div>
      </div>
    `;
    if (typeof lucide !== 'undefined' && lucide.createIcons) safeCreateIcons();
  }

  function showCustomConfirm(message, onConfirm, onCancel, title = 'Xác Nhận') {
    if (typeof SoundEngine !== 'undefined' && SoundEngine.playClick) SoundEngine.playClick();
    const modalContainer = document.getElementById('modal-container');
    if (!modalContainer) return;

    window._onCustomConfirmYes = function() {
      closeModal();
      if (typeof onConfirm === 'function') onConfirm();
    };

    window._onCustomConfirmNo = function() {
      closeModal();
      if (typeof onCancel === 'function') onCancel();
    };

    modalContainer.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="scroll-card max-w-sm w-full p-5 bg-white border-2 border-amber-400 relative text-center shadow-2xl">
          <div class="text-3xl mb-2">📜</div>
          <h3 class="text-base font-black text-red-900 uppercase mb-2">${title}</h3>
          <p class="text-base font-extrabold text-slate-800 mb-6 leading-relaxed">${message}</p>
          <div class="flex gap-3 justify-center">
            <button onclick="window._onCustomConfirmYes()" class="btn-3d btn-3d-red flex-1 py-2.5 rounded-xl font-black text-white text-sm shadow">
              Có
            </button>
            <button onclick="window._onCustomConfirmNo()" class="btn-3d px-5 py-2.5 rounded-xl font-extrabold text-slate-700 bg-slate-200 hover:bg-slate-300 text-sm">
              Không
            </button>
          </div>
        </div>
      </div>
    `;
    if (typeof lucide !== 'undefined' && lucide.createIcons) safeCreateIcons();
  }

  // Ghi đè alert & confirm hệ thống để không bao giờ xuất hiện dòng "The page at file..."
  window.alert = function(msg) {
    showCustomAlert(msg);
  };

  window.confirm = function(msg) {
    if (msg && (msg.includes('thoát') || msg.includes('bài thi') || msg.includes('rời khỏi'))) {
      confirmExitExam();
      return false;
    }
    return true;
  };

  window.handleAndroidBack = function() {
    // Nếu đang trong bài thi / vòng thi
    if (AppState.currentExamMode1 || (AppState.exam30Questions && AppState.exam30Questions.length > 0)) {
      confirmExitExam();
      return;
    }
    // Nếu đang mở modal
    const modalContainer = document.getElementById('modal-container');
    if (modalContainer && modalContainer.children.length > 0) {
      closeModal();
      return;
    }
    // Nếu đang ở màn hình con khác
    if (AppState.currentScreen && AppState.currentScreen !== 'HOME') {
      renderHome();
      return;
    }
    // Ngược lại thoát app
    if (typeof AndroidBridge !== 'undefined' && AndroidBridge.exitApp) {
      AndroidBridge.exitApp();
    }
  };

  // Khởi động
  window.addEventListener('DOMContentLoaded', () => {
    loadPersistedState();
    renderHome();
  });
  </script>
</body>
</html>
